[package]
name = "openbitfun-claude-code-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Claude Code static source adapter for OpenBitFun"
autotests = false

[lib]
name = "openbitfun_claude_code_adapter"
crate-type = ["rlib"]

[dependencies]
openbitfun-product-domains = { path = "../../contracts/product-domains", features = ["external-sources"] }
openbitfun-services-core = { path = "../../services/services-core", features = ["markdown"] }
openbitfun-static-hook-support = { path = "../static-hook-support" }
dirs = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "claude_code_source_contracts"
path = "tests/claude_code_source_contracts.rs"

[lints]
workspace = true
