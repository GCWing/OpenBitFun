[package]
name = "openbitfun-dsh-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "DeepSeek Harness (dsh) bundle source projection adapter for OpenBitFun"
autotests = false

[lib]
name = "openbitfun_dsh_adapter"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
openbitfun-plugin-runtime-client = { path = "../../execution/plugin-runtime-client" }
openbitfun-product-domains = { path = "../../contracts/product-domains", features = ["plugin-source", "external-sources"] }
openbitfun-static-hook-support = { path = "../static-hook-support" }
openbitfun-services-core = { path = "../../services/services-core" }
dirs = { workspace = true }
openbitfun-runtime-ports = { path = "../../contracts/runtime-ports", features = ["plugin-runtime"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
urlencoding = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "dsh_source_adapter"
path = "tests/dsh_source_adapter.rs"

[lints]
workspace = true
