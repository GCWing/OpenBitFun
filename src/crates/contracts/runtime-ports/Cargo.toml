[package]
name = "openbitfun-runtime-ports"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Thin runtime ports for OpenBitFun core decomposition"
autotests = false

[lib]
name = "openbitfun_runtime_ports"
crate-type = ["rlib"]

[[test]]
name = "plugin_runtime_contracts"
path = "tests/runtime_port_contracts.rs"
required-features = ["plugin-runtime"]

[[test]]
name = "git_port_contracts"
path = "tests/git_port_contracts.rs"
required-features = ["git-port"]

[[test]]
name = "script_tool_port_contracts"
path = "tests/script_tool_port_contracts.rs"
required-features = ["script-tool-runtime"]

[[test]]
name = "ptc_tool_port_contracts"
path = "tests/ptc_tool_port_contracts.rs"
required-features = ["ptc-runtime"]

[[test]]
name = "hook_function_runtime_contracts"
path = "tests/hook_function_runtime_contracts.rs"
required-features = ["hook-function-runtime"]

[[test]]
name = "session_store_contracts"
path = "tests/session_store_contracts.rs"
required-features = ["workspace-ports"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true }
openbitfun-product-domains = { path = "../product-domains", optional = true }
openbitfun-core-types = { path = "../core-types", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tokio-util = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[features]
default = []
agent-api = ["dep:openbitfun-core-types"]
plugin-runtime = []
hook-function-runtime = []
script-tool-runtime = []
ptc-runtime = []
web-search-port = []
workspace-ports = ["dep:anyhow", "dep:tokio-util", "dep:tokio", "tokio/io-util"]
terminal-port = ["dep:tokio"]
remote-exec-port = ["dep:tokio"]
tool-runtime-handles = [
    "workspace-ports",
    "terminal-port",
    "remote-exec-port",
]
remote-workspace-ports = []
git-port = []
runtime-event-port = []
permission = ["dep:openbitfun-product-domains"]
product-search = ["dep:openbitfun-product-domains"]
# Derive `ts_rs::TS` on the wire types so downstream crates (app-server) can
# export TypeScript bindings. The `permission` feature gates the product
# types; enabling `ts` requires `permission` so all TS-derivable types are in
# scope. `openbitfun-product-domains?/ts` is a weak feature reference: it adds the
# TS derive to the product-domain types only when `openbitfun-product-domains` is
# already enabled (always true here via `permission`), so `ts` cannot become an
# undeclared owner of the optional product-domain dependency.
ts = [
    "dep:ts-rs",
    "agent-api",
    "permission",
    "openbitfun-core-types/ts",
    "openbitfun-product-domains?/ts",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
