[package]
name = "openbitfun-product-domains"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun product domain owner crate"
autotests = false

[lib]
name = "openbitfun_product_domains"
crate-type = ["rlib"]

[[test]]
name = "product_domain_contracts"
path = "tests/product_domain_contracts.rs"

[[test]]
name = "plugin_source_contracts"
path = "tests/plugin_source_contracts.rs"
required-features = ["plugin-source"]

[[test]]
name = "external_source_contracts"
path = "tests/external_source_contracts.rs"
required-features = ["external-sources"]

[[test]]
name = "function_agent_contracts"
path = "tests/function_agent_contracts.rs"
required-features = ["function-agents"]

[[test]]
name = "miniapp_contracts"
path = "tests/miniapp_contracts.rs"
required-features = ["miniapp"]

[[test]]
name = "loopx_contracts"
path = "tests/loopx_contracts.rs"
required-features = ["miniapp"]

[[test]]
name = "legacy_migration_contracts"
path = "tests/legacy_migration_contracts.rs"
required-features = ["legacy-migration"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
dirs = { workspace = true, optional = true }
log = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
which = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
url = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[features]
default = []
appearance-market = ["hex", "sha2"]
plugin-source = ["hex", "sha2"]
miniapp = ["dirs", "hex", "sha2", "which", "dep:regex"]
function-agents = ["log"]
external-sources = ["hex", "hmac", "sha2", "url"]
legacy-migration = []
product-full = ["appearance-market", "plugin-source", "miniapp", "function-agents", "external-sources", "legacy-migration"]
# Derive `ts_rs::TS` on the wire types (permissions, etc.) for downstream
# TypeScript binding export. Orthogonal to the product feature groups; does not
# pull any optional integration dependency.
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
