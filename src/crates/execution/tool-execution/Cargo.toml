[package]
name = "tool-runtime"
version.workspace = true
edition.workspace = true

[features]
default = []
shell-analysis = []
document-read = ["dep:anydoc", "dep:pdf-inspector", "dep:roxmltree", "dep:sha2", "dep:zip"]
web-readable = ["dep:htmd", "dep:legible", "dep:readability-js"]

[dependencies]
anydoc = { workspace = true, optional = true }
openbitfun-agent-tools = { path = "../tool-contracts" }
openbitfun-core-types = { path = "../../contracts/core-types" }
openbitfun-events = { path = "../../contracts/events" }
openbitfun-runtime-ports = { path = "../../contracts/runtime-ports", features = ["workspace-ports"] }
dashmap = { workspace = true }
globset = { workspace = true }
dunce = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
htmd = { version = "0.5.4", optional = true }
ignore = { workspace = true }
legible = { version = "0.4.2", optional = true }
log = { workspace = true }
pdf-inspector = { workspace = true, optional = true }
regex = { workspace = true }
roxmltree = { workspace = true, features = ["std", "positions"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io-util"] }
vte = { workspace = true, features = ["ansi"] }
zip = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
readability-js = { version = "0.1.5", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
