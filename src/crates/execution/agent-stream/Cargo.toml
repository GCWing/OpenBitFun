[package]
name = "openbitfun-agent-stream"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Lightweight agent stream processing for OpenBitFun"

[lib]
name = "openbitfun_agent_stream"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
openbitfun-events = { path = "../../contracts/events" }
openbitfun-core-types = { path = "../../contracts/core-types" }
futures = { workspace = true }
jsonrepair-rs = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
openbitfun-agent-tools = { path = "../tool-contracts" }
tokio-stream = { workspace = true }

[lints]
workspace = true
