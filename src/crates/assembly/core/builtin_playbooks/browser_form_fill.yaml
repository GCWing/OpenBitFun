name: browser_form_fill
description: "Auto-fill a web form with provided data"
parameters:
  - name: url
    description: "The URL containing the form"
    required: true
  - name: form_data
    description: "JSON object of field-value pairs to fill. Keys should be CSS selectors, names, or @eN refs from the snapshot."
    required: true
steps:
  - domain: browser
    action: navigate
    params:
      url: "{{url}}"
      observe: snapshot
    description: "Open the form and inspect the returned snapshot. Map form_data to observed fields and call browser.fill for each; inspect the resulting form before an authorized submission."
