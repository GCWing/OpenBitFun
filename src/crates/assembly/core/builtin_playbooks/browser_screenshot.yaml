name: browser_screenshot
description: "Capture a screenshot of a web page"
parameters:
  - name: url
    description: "The URL to capture"
    required: true
  - name: wait_ms
    description: "Milliseconds to wait after page load before screenshot"
    required: false
    default: "0"
steps:
  - domain: browser
    action: navigate
    params:
      url: "{{url}}"
    description: "Navigate to the target URL"

  - domain: browser
    action: wait
    params:
      duration_ms: "{{wait_ms}}"
    description: "Apply only an explicitly requested post-load delay"
    condition: "wait_ms is not 0"

  - domain: browser
    action: screenshot
    description: "Capture the page screenshot"
    output_var: screenshot_data
