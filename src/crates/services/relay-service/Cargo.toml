[package]
name = "openbitfun-relay-service"
version = "1.0.5"
authors = ["OpenBitFun Team"]
edition = "2021"
description = "Reusable relay runtime for OpenBitFun Remote Connect"

[lib]
name = "openbitfun_relay_service"
path = "src/lib.rs"

[dependencies]
# Dependencies stay explicit so the service can be built with the standalone
# relay application without copying the root workspace manifest into Docker.
axum = { version = "0.8", features = ["json", "ws"] }
tower-http = { version = "0.6.11", features = ["cors"] }
# Keep the runtime surface explicit: relay needs multi-thread RT, timers,
# channels/semaphores, and TCP — not tokio's full feature set.
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
futures-util = "0.3.31"
tempfile = "3"
socketioxide = { version = "0.18.7", default-features = false, features = ["extensions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dashmap = "6"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# The relay stores verified account identity, device public keys, and opaque blobs.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
openbitfun-page-function-runtime = { path = "../page-function-runtime" }
# Two SQLite drivers here is deliberate, not drift. They own disjoint databases:
#
#   sqlx     -> async access to the relay's own control-plane schema (`db.rs`),
#               using trusted first-party SQL.
#   rusqlite -> per-page user databases (`page_data.rs`), which execute *untrusted*
#               SQL from Page Functions. That path needs sqlite3_set_authorizer,
#               sqlite3_limit, and a progress handler to sandbox it (statement
#               allow-listing, value/row caps, wall-clock interruption). sqlx
#               exposes none of these, so it cannot host this workload.
#
# Keep them separate. The direct `libsqlite3-sys` dependency selects its bundled
# feature, while Cargo resolves one compatible instance shared by both drivers.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
