[package]
name = "openbitfun-data-migrator"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
description = "OpenBitFun offline legacy data migrator"

[lib]
name = "openbitfun_data_migrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openbitfun-data-migrator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
openbitfun-legacy-migration-adapters = { path = "../../crates/services/legacy-migration-adapters" }
openbitfun-core-types = { path = "../../crates/contracts/core-types" }
openbitfun-legacy-migration = { path = "../../crates/services/legacy-migration" }
openbitfun-product-domains = { path = "../../crates/contracts/product-domains", features = ["legacy-migration"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
