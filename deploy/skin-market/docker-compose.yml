services:
  skin-market:
    build:
      context: ../..
      dockerfile: src/apps/skin-market-server/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${MARKET_CARGO_BUILD_JOBS:-}
        MARKET_GIT_COMMIT: ${MARKET_GIT_COMMIT:?Set MARKET_GIT_COMMIT to the deployed commit}
    image: openbitfun-skin-market:${MARKET_GIT_COMMIT}
    container_name: openbitfun-skin-market
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9720:9720"
    env_file:
      - ${SKIN_MARKET_ENV_FILE:-/etc/openbitfun-skin-market/market.env}
    environment:
      SKIN_MARKET_BIND: 0.0.0.0:9720
      SKIN_MARKET_DATABASE_PATH: /app/data/market.sqlite
      SKIN_MARKET_ARTIFACT_DIR: /app/artifacts
      SKIN_MARKET_WEB_DIR: /app/web
    volumes:
      - ${SKIN_MARKET_ROOT:-/srv/openbitfun-skin-market}/data:/app/data
      - ${SKIN_MARKET_ROOT:-/srv/openbitfun-skin-market}/artifacts:/app/artifacts
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9720/skin/api/v1/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
