# Loaded in Nginx's http context. Replace the placeholder ranges with the
# egress ranges of your own reverse proxy or WAF, and keep them synchronized
# with the origin firewall. XFF is considered only when the direct peer belongs
# to this explicit set.
geo $skin_market_trusted_waf_peer {
    default 0;
    192.0.2.0/24 1;
    2001:db8::/32 1;
}

map "$skin_market_trusted_waf_peer:$http_x_forwarded_for" $skin_market_client_address {
    "~^1:\s*(?<skin_market_client_ipv4>[0-9]{1,3}(?:\.[0-9]{1,3}){3})(?:\s*,|\s*$)" $skin_market_client_ipv4;
    "~^1:\s*(?<skin_market_client_ipv6>[0-9A-Fa-f:]{2,45})(?:\s*,|\s*$)" $skin_market_client_ipv6;
    default $remote_addr;
}

map $uri $skin_market_api_limit_key {
    default "";
    ~^/skin/api/v1/submissions/[^/]+/package$ "";
    ~^/skin/api/v1/ $skin_market_client_address;
}

map $uri $skin_market_upload_limit_key {
    default "";
    ~^/skin/api/v1/submissions/[^/]+/package$ $skin_market_client_address;
}

limit_req_zone $skin_market_api_limit_key zone=skin_market_api:10m rate=10r/s;
limit_req_zone $skin_market_upload_limit_key zone=skin_market_upload:10m rate=6r/m;
limit_conn_zone $skin_market_client_address zone=skin_market_connections:10m;
