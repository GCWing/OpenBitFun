server {
    listen 80;
    listen [::]:80;
    # Replace with the public hostname of your market deployment.
    server_name market.example.com;

    access_log /var/log/nginx/miniapp-market.access.log miniapp_market_json;
    # Nginx error records include the client address and cannot use a custom
    # anonymized format. Application errors remain available as structured logs.
    error_log /dev/null crit;

    client_max_body_size 25m;
    error_page 413 = @market_payload_too_large;

    location = / {
        return 308 https://market.example.com/miniapp/;
    }

    location = /miniapp {
        return 308 https://market.example.com/miniapp/;
    }

    location ^~ /miniapp/ {
        proxy_pass http://127.0.0.1:9710;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /skin {
        return 308 https://market.example.com/skin/;
    }

    location ^~ /skin/ {
        client_max_body_size 100m;
        error_page 413 = @skin_payload_too_large;
        error_page 429 = @skin_rate_limited;
        limit_req zone=skin_market_api burst=30 nodelay;
        limit_req zone=skin_market_upload burst=2 nodelay;
        limit_req_status 429;
        limit_conn skin_market_connections 8;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:9720;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # The http-level Skin config accepts XFF only from the explicit WAF
        # peer set. Forward one normalized address instead of the caller chain.
        proxy_set_header X-Real-IP $skin_market_client_address;
        proxy_set_header X-Forwarded-For $skin_market_client_address;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location @market_payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"Uploads must not exceed 25 MiB.","requestId":"$request_id"}}';
    }

    location @skin_payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"Appearance uploads must not exceed 96 MiB.","requestId":"$request_id"}}';
    }

    location @skin_rate_limited {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many Skin market requests. Retry shortly.","requestId":"$request_id"}}';
    }

    location / {
        return 404;
    }
}
