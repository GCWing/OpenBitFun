# Fail closed for hostnames that do not have an explicit Nginx vhost.
#
# Wildcard DNS or a shared WAF can route an unknown subdomain to this origin.
# Without a default_server, Nginx sends that request to whichever vhost was
# loaded first. Keep this server free of proxy_pass directives.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 "Not Found\n";
}
