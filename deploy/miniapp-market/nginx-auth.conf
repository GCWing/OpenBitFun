# Shared GitHub sign-in facade. Install beside the market host and replace the
# example hostnames below. The completion bridge keeps host-only marketplace
# cookies isolated from other subdomains. Requires the trusted-proxy peer map
# from relay-v1/nginx-http.conf and the miniapp_market_json log format.
server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    if ($relay_v1_trusted_origin_peer = 0) { return 403; }
    access_log /var/log/nginx/miniapp-auth.access.log miniapp_market_json;
    error_log /dev/null crit;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Replace with the egress ranges of your own reverse proxy or WAF.
    # The placeholder ranges below are documentation-only and trust nobody.
    set_real_ip_from 192.0.2.0/24;
    set_real_ip_from 2001:db8::/32;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    proxy_set_header Host market.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Preserve code/state byte-for-byte for the existing session owner. This
    # endpoint sets no cookies; only the market host completes the exchange.
    location = /api/v1/auth/github/callback {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 302 https://market.example.com/miniapp/api/v1/auth/github/callback$is_args$args;
    }

    # Pages sign-in uses the existing auth origin; published content stays on
    # the versioned remote origin. Expose only the browser sign-in endpoints.
    location ~ ^/v/1\.0\.0/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.0/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19700;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v1_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1-auth-access.log relay_v1_json;
    }

    location ~ ^/v/1\.0\.1/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19701;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v101_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1.0.1-auth-access.log relay_v1_json;
    }

    location ~ ^/v/1\.0\.2/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.2/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19702;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v102_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1.0.2-auth-access.log relay_v1_json;
    }

    location = /sign-in {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9710/miniapp/auth/sign-in;
    }
    location = / {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9710/miniapp/auth/complete;
    }
    location = /complete {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9710/miniapp/auth/complete;
    }
    # Bearer-token APIs only; marketplace mutations are not exposed here.
    location ~ ^/api/v1/(me|config|auth/desktop/(start|poll)|auth/login/(start|github)|auth/email/(send|verify)|auth/github/(start|callback)|auth/(refresh|logout))$ {
        rewrite ^/api/v1/(.*)$ /miniapp/api/v1/$1 break;
        proxy_pass http://127.0.0.1:9710;
    }
    location ^~ /miniapp/assets/ {
        proxy_pass http://127.0.0.1:9710;
    }
    location ~ ^/miniapp/(theme-init\.js|favicon\.(ico|svg)|apple-touch-icon\.png|site\.webmanifest)$ {
        proxy_pass http://127.0.0.1:9710;
    }
    location / { return 404; }
}
