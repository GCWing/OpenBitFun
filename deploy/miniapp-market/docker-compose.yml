services:
  miniapp-market:
    build:
      context: ../..
      dockerfile: src/apps/miniapp-market-server/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${MARKET_CARGO_BUILD_JOBS:-}
        MARKET_GIT_COMMIT: ${MARKET_GIT_COMMIT:?Set MARKET_GIT_COMMIT to the deployed commit}
    image: openbitfun-miniapp-market:${MARKET_GIT_COMMIT}
    container_name: openbitfun-miniapp-market
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9710:9710"
    env_file:
      - ${MINIAPP_MARKET_ENV_DIR:-/etc/openbitfun-miniapp-market}/market.env
      - path: ${MINIAPP_MARKET_ENV_DIR:-/etc/openbitfun-miniapp-market}/smtp.env
        required: false
    environment:
      MARKET_BIND: 0.0.0.0:9710
      MARKET_DATABASE_PATH: /app/data/market.sqlite
      MARKET_ARTIFACT_DIR: /app/artifacts
      MARKET_WEB_DIR: /app/web
    volumes:
      - ${MINIAPP_MARKET_ROOT:-/srv/openbitfun-miniapp-market}/data:/app/data
      - ${MINIAPP_MARKET_ROOT:-/srv/openbitfun-miniapp-market}/artifacts:/app/artifacts
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9710/miniapp/api/v1/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
