# Retirement answer for a Relay version that is being sunset.
#
# Install as /etc/nginx/relay-retired-location.conf (http context) and include it
# in the Relay server block *instead of* a bare `return 410`
# for the retired prefix, after the retired version's own Compose project has
# been stopped. It is the edge-only form: it keeps working after the retired
# container, image and volume are deleted, and it answers the same
# machine-readable body the relay serves itself, so current clients report
# "update OpenBitFun" instead of showing a bare 410 page.
#
# Replace 1.0.0 with the version being retired, and keep one block per retired
# version. The prefix answers the websocket upgrade path
# (`/v/<version>/v1/updates/`) as well, so no socket is ever established against
# a retired version.
#
# The body must stay byte-compatible with the relay's own answer:
# src/crates/services/relay-service/src/retired_version.rs
#   error           = "relay_version_retired"
#   update_required = true
#
# `no-store` matters: a client must not cache a retirement answer as a success.

location = /v/1.0.0 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 '{"error":"relay_version_retired","message":"This Relay version has been retired. Update OpenBitFun on this device, then sign in again to continue.","update_required":true}';
}

location ^~ /v/1.0.0/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 '{"error":"relay_version_retired","message":"This Relay version has been retired. Update OpenBitFun on this device, then sign in again to continue.","update_required":true}';
}
