# Generic Relay vhost example. The `/relay/` and root locations target the
# non-versioned Relay listener on port 9700. For the versioned `/v/1.0.2/`
# listener, include `nginx-location.conf` in this server block and adjust the
# upstream ports in `compose.yml`.
server {
    listen 80;
    listen [::]:80;

    # Replace with the public hostname of your Relay deployment.
    # Terminate TLS at your reverse proxy or WAF and forward plain HTTP here.
    server_name relay.example.com;

    # ── Homepage static files (exact match, served before proxy) ──
    location = / {
        root /srv/openbitfun-relay-v1.0.2/static/homepage;
        try_files /index.html =404;
    }

    location = /i18n.json {
        root /srv/openbitfun-relay-v1.0.2/static/homepage;
    }

    location = /i18n.shared.json {
        root /srv/openbitfun-relay-v1.0.2/static/homepage;
    }

    # ── Redirect /relay → /relay/ ──
    location = /relay {
        return 301 /relay/;
    }

    # ── With /relay prefix: strip prefix, proxy to relay server ──
    # For clients configured with https://relay.example.com/relay
    location /relay/ {
        proxy_pass http://127.0.0.1:9700/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_connect_timeout 10s;
        client_max_body_size 100m;
    }

    # ── Without prefix: proxy directly to relay server ──
    # For clients configured with https://relay.example.com
    location / {
        proxy_pass http://127.0.0.1:9700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_connect_timeout 10s;
        client_max_body_size 100m;
    }
}
