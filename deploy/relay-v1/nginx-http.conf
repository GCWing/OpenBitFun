# Install in /etc/nginx/conf.d/relay-v1.0.2.conf (http context).
map $http_upgrade $relay_v102_connection_upgrade {
    default upgrade;
    '' close;
}
# Same explicit Huawei WAF origin ranges as the existing market deployment.
# Refresh from the WAF control plane when its origin source ranges change.
geo $realip_remote_addr $relay_v102_trusted_origin_peer {
    default 0;
    127.0.0.1 1;
    ::1 1;
    190.92.193.0/24 1;
    159.138.94.0/24 1;
    101.44.169.0/24 1;
    2405:f080:110::/120 1;
}
limit_conn_zone $binary_remote_addr zone=relay_v102_client_connections:10m;
limit_conn_zone $server_name zone=relay_v102_global_connections:1m;
limit_req_zone $binary_remote_addr zone=relay_v102_client_requests:10m rate=100r/s;
limit_req_zone $server_name zone=relay_v102_global_requests:1m rate=2000r/s;
log_format relay_v102_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"requestTime":$request_time}';
