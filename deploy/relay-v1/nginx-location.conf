# Include inside the existing remote.openbitfun.com server block.
location = /v/1.0.2 {
    return 308 /v/1.0.2/;
}
location ^~ /v/1.0.2/ {
    # Trust forwarded addresses only from the existing explicit WAF peers.
    # Recursive extraction selects the last non-trusted address, not a spoofed
    # client-supplied leftmost XFF entry. Relay receives one overwritten value.
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }

    limit_conn relay_v102_client_connections 256;
    limit_conn relay_v102_global_connections 6144;
    limit_conn_status 429;
    limit_req zone=relay_v102_client_requests burst=200 nodelay;
    limit_req zone=relay_v102_global_requests burst=1000 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:19702/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_v102_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 65m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 140s;
    proxy_send_timeout 30s;
    access_log /var/log/nginx/relay-v1.0.2-access.log relay_v102_json;
}
