/* ============================================================
   渲染：三块屏
   ============================================================ */
const mountedTabs = new Set();

function geometryFor(display, indexOnDisplay) {
  const inner = $(`[data-display-inner="${display}"]`);
  const w = inner.clientWidth, h = inner.clientHeight;
  const k = indexOnDisplay;
  return {
    x: 12 + k * 16,
    y: 11 + k * 13,
    w: Math.max(190, w - 24 - k * 16),
    h: Math.max(140, h - 22 - k * 13),
  };
}

function renderDisplays() {
  const alive = new Set();

  [2, 3].forEach((display) => {
    const host = $(`[data-display-inner="${display}"]`);
    const tabs = state.tabs.filter((t) => t.where === 'display-' + display);
    host.innerHTML = '';

    if (!tabs.length) {
      host.innerHTML = `
        <div class="empty-hint">
          <div class="empty-hint__box">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.1"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
            <span class="empty-hint__title">空闲</span>
            <span>在面板里点 tab 上的跳出图标</span>
          </div>
        </div>`;
      return;
    }

    tabs.forEach((tab, i) => {
      if (!tab.win) tab.win = geometryFor(display, i);
      alive.add(tab.id);
      const fresh = !mountedTabs.has(tab.id);
      mountedTabs.add(tab.id);
      const { x, y, w, h } = tab.win;
      host.insertAdjacentHTML('beforeend', `
        <div class="detached${fresh ? '' : ' is-in'}" data-tab="${tab.id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
          <div class="detached__titlebar" data-role="dragbar" title="拖动可换屏">
            <div class="traffic"><i></i><i></i><i></i></div>
            <span class="detached__title">${tab.title}</span>
            <span class="detached__sub" data-role="winwhere">${DISPLAY_NAMES[display]}</span>
            <div class="detached__actions">
              <button class="ds-icon-btn" data-size="xs" data-action="open-real" data-tab-id="${tab.id}" title="换成真实浏览器窗口">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="9" height="8" rx="1.3" stroke="currentColor" stroke-width="1.2"/><path d="M8 8l5.5-5.5M10 2.5h3.5V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="ds-btn" data-size="xs" data-action="recall-tab" data-tab-id="${tab.id}">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M9 3h3.2A1.3 1.3 0 0113.5 4.3v7.9A1.3 1.3 0 0112.2 13.5H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.5 5.5L3 8l3.5 2.5M3.3 8h6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                收回
              </button>
            </div>
          </div>
          <div class="detached__body">${hubHTML(tab, 'full')}</div>
          <div class="detached__resize" data-role="resize"></div>
        </div>`);
    });

    requestAnimationFrame(() => {
      $$('.detached:not(.is-in)', host).forEach((el) => el.classList.add('is-in'));
      applyZoom();
    });
  });

  /* 清理已收回 tab 的挂载标记 */
  Array.from(mountedTabs).forEach((id) => { if (!alive.has(id)) mountedTabs.delete(id); });
}

/* ============================================================
   每块屏的状态：装了什么就标在那块屏的标签上，跨屏数收进页头
   ============================================================ */
function renderDisplayStatus() {
  const on = {};   /* display → 该屏上的 tab 名 */
  [2, 3].forEach((d) => {
    on[d] = state.tabs.filter((t) => t.where === 'display-' + d).map((t) => t.title);
  });

  [2, 3].forEach((d) => {
    const host = $(`[data-role="displaycontent"][data-display="${d}"]`);
    if (!host) return;
    const busy = on[d].length > 0;
    host.textContent = busy ? on[d].join('、') : '空闲';
    host.parentElement.classList.toggle('is-busy', busy);
    host.parentElement.classList.toggle('is-idle', !busy);
    /* 整块屏的忙碌态也在这里统一维护，避免散落在拖动 / 渲染各处 */
    $(`.display[data-display="${d}"]`)?.classList.toggle('is-busy', busy);
  });

  /* 用到几块屏 = 主屏 + 真正放了东西的副屏（不是"只要有跳出就一律算 3 屏"） */
  const count = 1 + [2, 3].filter((d) => on[d].length).length;
  const countEl = $('#visionCount');
  if (countEl) countEl.textContent = String(count);
}

/* ============================================================
   渲染：总入口
   ============================================================ */
function renderAll() {
  renderTabbar();
  renderPanel();
  renderDisplays();
  renderDisplayStatus();
  fitDesk();      /* 屏标签里的状态文案会换行，缩放要跟着重算 */
  bindAll();
  broadcast();
}

/* ============================================================
   缩放
   ============================================================ */
function applyZoom() {
  $$('[data-role="canvas"]').forEach((canvas) => {
    const owner = canvas.closest('[data-tab]');
    const tab = owner ? tabById(owner.dataset.tab) : null;
    if (!tab) return;
    const device = deviceOf(tab.device);
    const vp = $('.viewport', canvas);
    const sizer = $('.viewport-sizer', canvas);
    if (!vp || !sizer) return;
    const avail = Math.max(40, canvas.clientWidth - 26);
    const k = tab.zoom === '100' ? 1 : Math.min(1, avail / device.width);
    vp.style.transform = `scale(${k})`;
    vp.style.width = device.width + 'px';
    sizer.style.width = device.width * k + 'px';
    sizer.style.height = vp.offsetHeight * k + 'px';
    const label = $('[data-role="scale"]', canvas.closest('.hub__canvas-wrap') || document);
    if (label) label.textContent = `适配 ${Math.round(k * 100)}%`;
  });
}

/* ============================================================
   跳出 / 收回
   ============================================================ */
function nextDisplay() {
  const poppedOn2 = state.tabs.filter((t) => t.where === 'display-2').length;
  const poppedOn3 = state.tabs.filter((t) => t.where === 'display-3').length;
  return poppedOn2 <= poppedOn3 ? 2 : 3;
}

function nextAvailableTab(afterId) {
  const order = state.tabs;
  const start = order.findIndex((t) => t.id === afterId);
  for (let i = 1; i <= order.length; i++) {
    const t = order[(start + i) % order.length];
    if (!isPopped(t)) return t.id;
  }
  return afterId;   // 全部已跳出
}

function popTab(tabId, silent) {
  const tab = tabById(tabId);
  if (!tab || isPopped(tab)) { if (tab) flashTab(tabId); return; }

  const from = $('#panelBody .hub')?.getBoundingClientRect() || $('#panelBody').getBoundingClientRect();
  const display = nextDisplay();
  const indexOnDisplay = state.tabs.filter((t) => t.where === 'display-' + display).length;
  tab.where = 'display-' + display;
  tab.win = geometryFor(display, indexOnDisplay);

  if (state.activeId === tabId) state.activeId = nextAvailableTab(tabId);

  renderAll();

  const target = $(`.detached[data-tab="${tabId}"]`);
  if (target) flyGhost(from, target.getBoundingClientRect());
  if (!silent) toast(`「${tab.title}」已跳到 ${DISPLAY_NAMES[display]}${state.activeId !== tabId ? `，下一个 tab 已顶上` : ''}`);
}

function recallTab(tabId, silent) {
  const tab = tabById(tabId);
  if (!tab || !isPopped(tab)) return;
  const el = $(`.detached[data-tab="${tabId}"]`);
  const from = el ? el.getBoundingClientRect() : null;

  if (tab.where === 'window') {
    const w = state.popups.get(tabId);
    if (w) { try { w.close(); } catch (_) {} state.popups.delete(tabId); }
  }
  tab.where = null;
  tab.win = null;
  mountedTabs.delete(tabId);
  if (!tabById(state.activeId) || isPopped(tabById(state.activeId))) state.activeId = tabId;

  renderAll();
  const to = $('#panelBody').getBoundingClientRect();
  if (from) flyGhost(from, to);
  if (!silent) toast(`「${tab.title}」已收回面板`);
}

function recallAll() {
  const ids = state.tabs.filter(isPopped).map((t) => t.id);
  if (!ids.length) return;
  ids.forEach((id) => {
    const t = tabById(id);
    if (t.where === 'window') {
      const w = state.popups.get(id);
      if (w) { try { w.close(); } catch (_) {} state.popups.delete(id); }
    }
    t.where = null; t.win = null; mountedTabs.delete(id);
  });
  /* 收回后所有 tab 都回到了面板，当前激活项必然有效，无需再校正 */
  renderAll();
  toast('全部收回面板');
}

function flashTab(tabId) {
  const el = $(`.detached[data-tab="${tabId}"]`);
  const display = tabById(tabId)?.where;
  const dEl = display && display.startsWith('display-') ? $(`.display[data-display="${display.replace('display-', '')}"]`) : null;
  [el, dEl].forEach((n) => {
    if (!n) return;
    n.classList.add('is-flash');
    setTimeout(() => n.classList.remove('is-flash'), 950);
  });
  if (!el) toast('它在真实浏览器窗口中，切过去看看');
}

/* ============================================================
   真实窗口
   ============================================================ */
function surfaceURL(tab) {
  const p = new URLSearchParams({
    openbitfunWindow: 'browser-detached',
    browserUrl: tab.url || `openbitfun://design-lab/${tab.kind}/${tab.id}`,
    browserTitle: `${tab.title} — OpenBitFun`,
    demoTab: tab.id,
  });
  return `${location.pathname}?${p.toString()}`;
}

function openRealWindow(tabId) {
  const tab = tabById(tabId);
  if (!tab) return;
  const w = window.open(surfaceURL(tab), `openbitfun-detached-${tab.id}`, 'width=1080,height=740,menubar=no,toolbar=no,location=no,status=no');
  if (!w) { toast('浏览器拦截了弹窗：请允许本站弹出窗口后重试'); return; }

  const wasPopped = isPopped(tab);
  const display = wasPopped && tab.where.startsWith('display-') ? tab.where : null;
  const indexOnDisplay = display ? state.tabs.filter((t) => t.where === display).length : 0;

  state.popups.set(tab.id, w);
  tab.where = 'window';
  tab.win = null;
  mountedTabs.delete(tab.id);
  if (state.activeId === tab.id) state.activeId = nextAvailableTab(tab.id);

  renderAll();
  toast(`「${tab.title}」已在真实浏览器窗口中打开`);

  const timer = setInterval(() => {
    if (!state.popups.has(tab.id) || state.popups.get(tab.id).closed) {
      clearInterval(timer);
      if (state.popups.get(tab.id) === w) {
        state.popups.delete(tab.id);
        if (tab.where === 'window') {
          tab.where = null; tab.win = null;
          if (!tabById(state.activeId) || isPopped(tabById(state.activeId))) state.activeId = tab.id;
          renderAll();
          toast(`真实窗口已关闭，「${tab.title}」回到面板`);
        }
      }
    }
  }, 500);
}

function broadcast() {
  state.popups.forEach((w, tabId) => {
    if (!w || w.closed) return;
    const tab = tabById(tabId);
    try { w.postMessage({ type: 'obf:state', state: { device: tab.device, zoom: tab.zoom, title: tab.title } }, '*'); } catch (_) {}
  });
}

/* ============================================================
   飞行动画
   ============================================================ */
function flyGhost(from, to) {
  if (!from || !to || from.width < 4 || to.width < 4) return;
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  Object.assign(ghost.style, {
    left: from.left + 'px', top: from.top + 'px',
    width: from.width + 'px', height: from.height + 'px',
  });
  document.body.appendChild(ghost);
  const dx = to.left - from.left, dy = to.top - from.top;
  const sx = to.width / from.width, sy = to.height / from.height;
  ghost.animate(
    [{ transform: 'none', opacity: 0.95 }, { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: 0.4 }],
    { duration: 430, easing: 'cubic-bezier(.22,1,.36,1)' }
  ).onfinish = () => ghost.remove();
}

/* ============================================================
   拖动 / 缩放 / 跨屏
   ============================================================ */
let drag = null;
const fitScale = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1;

function screenAt(clientX, clientY) {
  return $$('[data-display-inner]').find((el) => {
    const r = el.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }) || null;
}

function bindAll() {
  $$('.detached').forEach((win) => {
    const bar = $('[data-role="dragbar"]', win);
    const grip = $('[data-role="resize"]', win);
    if (bar) bar.addEventListener('pointerdown', (ev) => startDrag(ev, win, 'move'));
    if (grip) grip.addEventListener('pointerdown', (ev) => startDrag(ev, win, 'resize'));
  });
}

function startDrag(ev, win, mode) {
  if (ev.target.closest('[data-action]')) return;   // 标题栏上的按钮不触发拖动
  ev.preventDefault();
  const rect = win.getBoundingClientRect();
  drag = {
    mode, win,
    tabId: win.dataset.tab,
    startX: ev.clientX, startY: ev.clientY,
    grabDX: ev.clientX - rect.left, grabDY: ev.clientY - rect.top,
    startW: rect.width, startH: rect.height,
    scale: fitScale(),
  };
  win.style.cursor = mode === 'move' ? 'grabbing' : 'nwse-resize';
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', endDrag, { once: true });
}

function onDragMove(ev) {
  if (!drag) return;
  const { mode, win, tabId, scale, startX, startY, grabDX, grabDY, startW, startH } = drag;
  const tab = tabById(tabId);
  if (!tab) return;

  if (mode === 'move') {
    /* 期望位置（视口坐标） */
    const wantLeft = ev.clientX - grabDX;
    const wantTop = ev.clientY - grabDY;
    const cx = wantLeft + win.offsetWidth * scale / 2;
    const cy = wantTop + win.offsetHeight * scale / 2;

    const target = screenAt(cx, cy) || screenAt(ev.clientX, ev.clientY);
    /* Display 1 承载的是主窗口本身，浮窗不能塞进去 */
    if (target && target !== win.parentElement && target.dataset.displayInner !== '1') {
      target.appendChild(win);
      tab.where = 'display-' + target.dataset.displayInner;
      /* 换到更小的屏时收敛尺寸，否则窗口会溢出被裁掉 */
      const box = target.getBoundingClientRect();
      let w = win.offsetWidth, h = win.offsetHeight;
      const maxW = box.width / scale - 8, maxH = box.height / scale - 8;
      if (w > maxW) { w = Math.max(150, maxW); win.style.width = w + 'px'; }
      if (h > maxH) { h = Math.max(140, maxH); win.style.height = h + 'px'; }
      if (tab.win) { tab.win.w = w; tab.win.h = h; }
      renderDisplayStatus();
    }

    const inner = win.parentElement.getBoundingClientRect();
    const wCss = win.offsetWidth, hCss = win.offsetHeight;
    let left = (wantLeft - inner.left) / scale;
    let top = (wantTop - inner.top) / scale;
    left = Math.max(4, Math.min(inner.width / scale - wCss - 4, left));
    top = Math.max(4, Math.min(inner.height / scale - hCss - 4, top));
    win.style.left = left + 'px';
    win.style.top = top + 'px';
    if (tab.win) { tab.win.x = left; tab.win.y = top; }
    const sub = $('[data-role="winwhere"]', win);
    if (sub && tab.where && tab.where.startsWith('display-')) sub.textContent = DISPLAY_NAMES[Number(tab.where.replace('display-', ''))];
  } else {
    const inner = win.parentElement.getBoundingClientRect();
    const wCss = win.offsetWidth, hCss = win.offsetHeight;
    const x = parseFloat(win.style.left) || 0;
    const y = parseFloat(win.style.top) || 0;
    const wantW = startW / scale + (ev.clientX - startX) / scale;
    const wantH = startH / scale + (ev.clientY - startY) / scale;
    const w = Math.max(190, Math.min(inner.width / scale - x - 4, wantW));
    const h = Math.max(140, Math.min(inner.height / scale - y - 4, wantH));
    win.style.width = w + 'px';
    win.style.height = h + 'px';
    if (tab.win) { tab.win.w = w; tab.win.h = h; }
  }
  applyZoom();
}

function endDrag() {
  if (!drag) return;
  if (drag.win) drag.win.style.cursor = '';
  drag = null;
  window.removeEventListener('pointermove', onDragMove);
  /* 落定后整树重渲染：tab 角标、面板占位符、屏上标签都跟着新落点走 */
  renderAll();
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const tabId = el.dataset.tabId;

  if (a === 'activate-tab') {
    state.activeId = tabId;
    renderTabbar(); renderPanel(); bindAll();
  } else if (a === 'pop-tab') { popTab(tabId); }
  else if (a === 'pop-active') { if (state.activeId) popTab(state.activeId); }
  else if (a === 'recall-tab') { recallTab(tabId); }
  else if (a === 'recall-all') { recallAll(); }
  else if (a === 'focus-tab') { flashTab(tabId); if (tabId !== state.activeId) { state.activeId = tabId; renderTabbar(); renderPanel(); bindAll(); } }
  else if (a === 'focus-display') {
    const d = el.dataset.display;
    const dEl = $(`.display[data-display="${d}"]`);
    const own = state.tabs.filter((t) => t.where === 'display-' + d);
    if (own.length) { own.forEach((t, i) => setTimeout(() => flashTab(t.id), i * 160)); }
    else if (dEl) { dEl.classList.add('is-flash'); setTimeout(() => dEl.classList.remove('is-flash'), 950); }
  }
  else if (a === 'open-real') { openRealWindow(tabId || state.activeId); }
  else if (a === 'pick-device') {
    const t = tabById(tabId); if (!t) return;
    t.device = el.dataset.device;
    renderPanel(); renderDisplays(); bindAll(); broadcast();
  }
  else if (a === 'zoom') {
    const t = tabById(tabId); if (!t) return;
    t.zoom = el.dataset.zoom;
    renderPanel(); renderDisplays(); bindAll(); broadcast();
  }
  else if (a === 'close-popup') {
    try { window.opener?.postMessage({ type: 'obf:recall' }, '*'); } catch (_) {}
    window.close();
  }
  else if (a === 'reset') { resetAll(); }
  else if (a === 'toggle-play') { togglePlay(); }
  else if (a === 'replay') { play(0); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { recallAll(); return; }
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest?.('[data-action][role="tab"], [data-action][role="button"]');
    if (el) { e.preventDefault(); el.click(); return; }
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }   /* 空格播放 / 暂停 */
  }
});

/* 用户一动手就交出控制权 —— 合成事件（演示自己派发的）不算接管 */
document.addEventListener('pointerdown', (e) => {
  if (!e.isTrusted || !director.playing) return;
  if (e.target.closest?.('.director')) return;
  pauseDirector();
  toast('已接管，自动演示暂停');
}, true);

window.addEventListener('message', (e) => {
  if ((e.data || {}).type === 'obf:recall') {
    state.popups.forEach((w, id) => {
      if (w.closed) return;
      const t = tabById(id);
      if (t?.where === 'window') { t.where = null; t.win = null; }
      state.popups.delete(id);
    });
    renderAll();
  }
});

/* ============================================================
   自适应
   ============================================================ */
function fitDesk() {
  const displays = $('.displays');
  const fit = $('#fit');
  const desk = $('.desk');
  if (!displays || !fit || !desk) return;
  /* 页头不参与缩放，但会占掉可视高度。除了子元素高度和 gap，
     还要算上 .desk 自己的上下内边距 —— 原来只硬编码了下边距 20，
     后来 .desk 加上 16px 上内边距就漏算了，页面会多溢出 8px。
     改成从 computed style 读，以后再调内边距不用回来动这里。 */
  const kids = $$('.desk > *');
  const dcs = getComputedStyle(desk);
  const padY = parseFloat(dcs.paddingTop) + parseFloat(dcs.paddingBottom);
  const rowGap = parseFloat(dcs.rowGap) || 0;
  const chrome = $$('.desk > *:not(#fit)').reduce((n, el) => n + el.offsetHeight, 0)
    + rowGap * Math.max(0, kids.length - 1)  /* .desk 的 gap 总数 */
    + padY                                   /* .desk 的上下内边距 */
    + 8;                                     /* 留白 */
  /* 宽度取 .desk 的真实可用宽度，而不是 window.innerWidth ——
     .desk 自带 min(1120px, 100% - 32px) 上限，用窗口宽度会高估。 */
  const availW = desk.clientWidth;
  const availH = window.innerHeight - chrome;
  const k = Math.min(1, availW / displays.offsetWidth, availH / displays.offsetHeight);
  document.documentElement.style.setProperty('--fit', String(k));

  /* scale() 不改变布局盒尺寸：不校正的话缩放区仍按原始高度占位，
     下方会留出一大片空白。把包装盒压到缩放后的真实高度。 */
  fit.style.height = Math.round(displays.offsetHeight * k) + 'px';
}
window.addEventListener('resize', () => { fitDesk(); applyZoom(); });
/* 预览面板被拖拽缩放时不一定触发 window resize，--fit 就会停在旧值。
   只盯宽度：fitDesk() 会改 #fit 的高度，跟着盯高度会自己触发自己。 */
if (typeof ResizeObserver === 'function') {
  let lastW = 0;
  new ResizeObserver((entries) => {
    const w = entries[0].contentRect.width;
    if (Math.abs(w - lastW) < 1) return;
    lastW = w;
    fitDesk();
    applyZoom();
  }).observe(document.querySelector('.desk'));
}

let toastTimer = null;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('is-in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-in'), 2800);
}

/* ============================================================
   重置
   ============================================================ */
function resetAll() {
  state.popups.forEach((w) => { try { w.close(); } catch (_) {} });
  state.popups.clear();
  mountedTabs.clear();
  state.tabs = TABS_INIT.map((t) => ({ ...t, where: null, win: null }));
  state.activeId = 'prd';
  renderAll();
}

/* ============================================================
   实时播放（自动演示）
   ------------------------------------------------------------
   光标是虚拟的，但操作是真的：每一步调的都是手动点击时那套函数，
   拖动那一步甚至派发真实 PointerEvent，走的是和手动拖动同一条代码路径。
   ============================================================ */
const PLAY_SVG = '<svg width="13" height="13" viewBox="0 0 12 12"><path d="M3.4 2.3 9.3 6 3.4 9.7z" fill="currentColor"/></svg>';
const PAUSE_SVG = '<svg width="13" height="13" viewBox="0 0 12 12"><rect x="3.1" y="2.3" width="2.1" height="7.4" rx=".9" fill="currentColor"/><rect x="6.8" y="2.3" width="2.1" height="7.4" rx=".9" fill="currentColor"/></svg>';

const STEPS = [
  {
    say: '三块屏：主屏在改需求，副屏留给 Agent 把要看的东西铺开。',
    hold: 2600,
  },
  {
    say: 'PRD 先跳到 Display 2 —— 长文档需要横向空间。',
    focus: 2, target: '#popBtn',
    action: () => popTab('prd', true), hold: 2400,
  },
  {
    say: '跳走的 tab 从面板让位，页面 1 自动顶上。',
    target: () => $('.tab.is-active'), hold: 2600,
  },
  {
    say: '页面 1 再跳到 Display 3 —— 一边看 PRD，一边看页面。',
    focus: 3, target: '#popBtn',
    action: () => popTab('page-1', true), hold: 2600,
  },
  {
    say: '每块屏装了什么，就标在那块屏上方 —— Agent 读得到，你也一眼看得见。',
    target: () => $('.display[data-display="3"] .display__status'), hold: 3000,
  },
  {
    say: '页面 2 也铺开 —— 级联错位，不互相遮挡。',
    focus: 2, target: '#popBtn',
    action: () => popTab('page-2', true), hold: 2600,
  },
  {
    say: '落点不合适？直接把窗口拖到另一块屏。',
    focus: 3, drag: { tabId: 'prd', toDisplay: 3 }, hold: 2600,
  },
  {
    say: '要专注的时候一键收回：屏幕跟着任务走，而不是任务挤在一块屏里。',
    target: () => $('#recallAllBtn'),
    action: () => recallAll(), hold: 3200,
  },
];

const director = { playing: false, i: 0, token: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const stale = (t) => t !== director.token;

function directorUI() {
  const btn = $('#playBtn');
  if (btn) btn.innerHTML = director.playing ? PAUSE_SVG : PLAY_SVG;
  document.body.classList.toggle('is-playing', director.playing);
  const dots = $('#stepDots');
  if (dots) {
    dots.innerHTML = STEPS.map((_, k) =>
      `<i class="${k === director.i && director.playing ? 'is-now' : k < director.i ? 'is-done' : ''}"></i>`).join('');
  }
  const bar = $('#progress i');
  if (bar) bar.style.transform = `scaleX(${(director.i + (director.playing ? 1 : 0)) / STEPS.length})`;
}

function setCaption(text, i) {
  const box = $('#caption');
  if (!box) return;
  if (text === null) { box.classList.remove('is-in'); return; }
  $('#captionIdx').textContent = `${i + 1} / ${STEPS.length}`;
  $('#captionText').textContent = text;
  box.classList.add('is-in');
}

function spotlight(display) {
  $$('.display').forEach((d) => d.classList.toggle('is-dim', !!display && d.dataset.display !== String(display)));
}

function cursorToPoint(x, y, dur) {
  const el = $('#vcur');
  if (!el) return;
  el.style.transitionDuration = (dur ?? 620) + 'ms';
  el.style.transform = `translate3d(${Math.round(x) - 3}px, ${Math.round(y) - 2}px, 0)`;
}

async function cursorToEl(el, dur) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  cursorToPoint(r.left + r.width / 2, r.top + Math.min(r.height / 2, 18), dur);
  await sleep((dur ?? 620) + 60);
}

const pressCursor = (on) => $('#vcur')?.classList.toggle('is-down', !!on);

function pressTarget(el) {
  if (!el) return;
  el.classList.add('is-pressed');
  setTimeout(() => el.classList.remove('is-pressed'), 240);
}

function rippleAt(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  el.animate(
    [{ transform: 'scale(.35)', opacity: 0.85 }, { transform: 'scale(2.8)', opacity: 0 }],
    { duration: 480, easing: 'cubic-bezier(.22,1,.36,1)' }
  ).onfinish = () => el.remove();
}

/* 拖动：派发真实指针事件，链路和手动拖动完全一致 */
async function animateDrag(tabId, toDisplay, token) {
  const win = $(`.detached[data-tab="${tabId}"]`);
  const target = $(`[data-display-inner="${toDisplay}"]`);
  if (!win || !target) return;

  const r = win.getBoundingClientRect();
  const startX = r.left + 80, startY = r.top + 15;
  await cursorToPoint(startX, startY, 560);
  if (stale(token)) return;

  const cur = $('#vcur');
  if (cur) cur.style.transitionDuration = '60ms';   /* 拖动时跟手，不用长缓动 */
  pressCursor(true);
  $('[data-role="dragbar"]', win).dispatchEvent(
    new PointerEvent('pointerdown', { clientX: startX, clientY: startY, bubbles: true, pointerId: 1 }));

  const t = target.getBoundingClientRect();
  const endX = t.left + t.width / 2, endY = t.top + t.height * 0.42;
  const N = 26;
  for (let k = 1; k <= N; k++) {
    if (stale(token)) {
      window.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1 }));
      pressCursor(false);
      if (cur) cur.style.transitionDuration = '620ms';
      return;
    }
    const cx = startX + (endX - startX) * k / N;
    const cy = startY + (endY - startY) * k / N;
    cursorToPoint(cx, cy, 60);
    window.dispatchEvent(new PointerEvent('pointermove', { clientX: cx, clientY: cy, pointerId: 1 }));
    await sleep(18);
  }
  window.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1 }));
  pressCursor(false);
  if (cur) cur.style.transitionDuration = '620ms';   /* 恢复常态缓动 */
}

async function play(from = 0) {
  const token = ++director.token;
  director.playing = true;
  director.i = from;
  directorUI();

  if (from === 0) {
    resetAll();
    await sleep(520);
    if (stale(token)) return;
  }

  for (let i = from; i < STEPS.length; i++) {
    if (stale(token)) return;
    director.i = i;
    directorUI();
    const s = STEPS[i];
    spotlight(s.focus);
    setCaption(s.say, i);

    if (s.drag) {
      await animateDrag(s.drag.tabId, s.drag.toDisplay, token);
    } else {
      const el = typeof s.target === 'function' ? s.target() : (s.target ? $(s.target) : null);
      if (el) {
        await cursorToEl(el, 620);
        if (stale(token)) return;
        const r = el.getBoundingClientRect();
        rippleAt(r.left + r.width / 2, r.top + Math.min(r.height / 2, 18));
        pressCursor(true);
        pressTarget(el);
        await sleep(150);
        pressCursor(false);
        if (stale(token)) return;
      }
      if (s.action) s.action();
    }
    await sleep(s.hold ?? 2000);
  }

  if (stale(token)) return;
  await sleep(1000);
  if (stale(token)) return;
  play(0);   /* 循环 */
}

function pauseDirector() {
  if (!director.playing) return;
  director.token++;
  director.playing = false;
  pressCursor(false);
  directorUI();
  setCaption(null);
  spotlight(null);
}

function togglePlay() {
  if (director.playing) pauseDirector();
  else play(director.i);
}

/* ============================================================
   启动
   ============================================================ */
const params = new URLSearchParams(location.search);

if (params.get('openbitfunWindow') === 'browser-detached') {
  document.body.classList.add('mode-surface');
  const demoTabId = params.get('demoTab');
  const def = TABS_INIT.find((t) => t.id === demoTabId) || TABS_INIT[0];
  const tab = { ...def, where: null, win: null };
  state.tabs = [{ ...tab, id: '__surface__' }];
  state.activeId = '__surface__';

  const title = params.get('browserTitle');
  if (title) document.title = title;
  $('#surfaceTitle').textContent = title || tab.title;

  const paint = () => { $('#surfaceBody').innerHTML = hubHTML(tab, 'full'); applyZoom(); };
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'obf:state' && d.state) {
      if (d.state.device) tab.device = d.state.device;
      if (d.state.zoom) tab.zoom = d.state.zoom;
      paint();
    }
  });
  try { window.opener?.postMessage({ type: 'obf:ready' }, '*'); } catch (_) {}
  paint();
} else {
  renderAll();   /* 先渲染，fitDesk 才能量到视野栏的真实高度 */
  fitDesk();
  directorUI();

  /* 进页面就实时播放。尊重系统的「减弱动态效果」，也可以 ?manual=1 关掉。 */
  const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  if (!params.get('manual') && !reduceMotion) setTimeout(() => play(0), 850);
}
</script>
