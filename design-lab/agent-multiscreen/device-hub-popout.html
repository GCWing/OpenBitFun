* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--openbitfun-color-surface-canvas);
  color: var(--openbitfun-color-content-primary);
  font: 13px/1.5 var(--openbitfun-font-family-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
code { font-family: var(--openbitfun-font-family-mono); }
:focus-visible { outline: 2px solid var(--openbitfun-color-action-primary-background); outline-offset: 2px; }

/* ════════════════════════════════════════════════════════════════════════
   页面框架
   ════════════════════════════════════════════════════════════════════════ */
.desk {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  width: min(1120px, calc(100% - 32px));
  margin-inline: auto;
  padding: 16px 0 20px;
  min-height: 100%;
}
.desk__fit { transform: scale(var(--fit)); transform-origin: top center; }

/* 页头不做卡片：不铺底、不描边、不圆角，直接落在画布上 */
.site-header {
  width: 100%; height: 72px; flex: 0 0 72px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 30px; height: 30px; flex: 0 0 30px;
  background: var(--demo-logo) center / contain no-repeat;
}
.brand__text { display: grid; gap: 3px; line-height: 1; }
.brand__text strong { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
.brand__text small {
  font-family: var(--openbitfun-font-family-mono); font-size: 8.5px; letter-spacing: 0.18em;
  color: var(--openbitfun-color-content-caption); text-transform: uppercase;
}
.header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--openbitfun-space-3); }
/* 页头按钮直接用 .ds-btn（= Button 的 outline 变体），不再另起一套 */

/* Agent 视野：跨屏数 —— 一行小字 + 一个圆点 */
.vision-badge {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  font-size: 11px; color: var(--openbitfun-color-content-secondary);
}
.vision-badge i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--openbitfun-color-content-secondary);
}
.vision-badge b { font-weight: 700; color: var(--openbitfun-color-content-primary); }

/* ════════════════════════════════════════════════════════════════════════
   三块屏：主屏在上，两个副屏并列在下
   ════════════════════════════════════════════════════════════════════════ */
.displays {
  display: grid;
  grid-template-columns: auto auto;
  justify-content: center;
  align-items: start;
  gap: 20px;
}
/* 主屏独占两列居中；两个副屏落在第二行，左右并列 */
.display[data-display="1"] { grid-column: 1 / -1; justify-self: center; }
.display { display: flex; flex-direction: column; gap: 7px; align-items: center; }
.display__label {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 9.5px/1 var(--openbitfun-font-family-mono); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--openbitfun-color-content-caption);
}
.display__label b { font-weight: 700; color: var(--openbitfun-color-content-secondary); letter-spacing: 0.1em; }
.display.is-busy .display__label b { color: var(--openbitfun-color-action-primary-background); }
/* 这块屏现在装着什么 —— 就标在这块屏上方，点一下聚焦。
   配方照抄 StatusPill：药丸 + meta 字阶 + 上下 2px 左右 6px，tone 决定色。
   类名保留 .display__status 是因为演示脚本要按它定位（命中点），不是样式需要。 */
.display__status {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--openbitfun-control-status-pill-gap);
  padding-block: var(--openbitfun-control-status-pill-padding-block);
  padding-inline: var(--openbitfun-control-status-pill-padding-inline);
  border: 0;
  border-radius: var(--openbitfun-control-status-pill-radius);
  color: var(--openbitfun-color-content-secondary);
  background: var(--openbitfun-color-action-neutral-surface);
  font-family: var(--openbitfun-type-meta-font-family);
  font-size: var(--openbitfun-type-meta-font-size);
  font-weight: var(--openbitfun-type-meta-font-weight);
  line-height: var(--openbitfun-type-status-pill-line-height);
  letter-spacing: var(--openbitfun-type-meta-letter-spacing);
  white-space: nowrap; cursor: pointer;
  transition: color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.display__status:hover { color: var(--openbitfun-color-content-primary); background: var(--openbitfun-color-action-neutral-surface-hover); }
/* 空闲比常态更轻，别跟「有内容」抢注意力 */
.display__status.is-idle {
  color: var(--openbitfun-color-content-caption); background: transparent;
}
/* 正在显示内容：提到成功 tone，和真系统里「状态良好」用同一组色 */
.display__status.is-busy {
  color: var(--openbitfun-color-status-success-content);
  background: var(--openbitfun-color-status-success-surface);
}
.display__status.is-idle::before {
  content: ''; inline-size: 5px; block-size: 5px;
  border-radius: var(--openbitfun-radius-pill);
  background: currentColor; opacity: 0.6;
}

.screen {
  position: relative; padding: 9px; border-radius: var(--openbitfun-radius-xl);
  background: var(--openbitfun-color-surface-panel); border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-default);
  transition: border-color 0.2s var(--openbitfun-motion-easing-standard);
}
.display[data-display="1"] .screen { width: 620px; height: 420px; }
.display[data-display="2"] .screen { width: 620px; height: 340px; }
.display[data-display="3"] .screen { width: 330px; height: 420px; }
/* 聚焦态直接动边框色 —— 上一轮把边框撤了才改用内阴影，现在边框回来了 */
.display.is-busy .screen { border-color: var(--openbitfun-color-border-strong); }
.display.is-flash .screen { border-color: var(--openbitfun-color-action-primary-background); }
.screen__inner {
  position: relative; width: 100%; height: 100%;
  border-radius: var(--openbitfun-radius-lg); overflow: hidden;
  background: var(--openbitfun-color-surface-workbench); border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}

/* ════════════════════════════════════════════════════════════════════════
   应用窗口
   ════════════════════════════════════════════════════════════════════════ */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--openbitfun-color-surface-panel); }
.titlebar {
  display: flex; align-items: center; gap: 9px;
  height: 36px; flex: 0 0 36px; padding: 0 12px;
  background: var(--openbitfun-color-surface-chrome); border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
.traffic { display: flex; gap: 5px; }
.traffic i { width: 7px; height: 7px; border-radius: 50%; background: var(--openbitfun-color-border-strong); opacity: 0.5; }
.titlebar__tabs { display: flex; gap: 3px; margin-left: 4px; overflow: hidden; }
.titlebar__tab {
  height: 22px; padding: 0 9px; border-radius: var(--openbitfun-radius-sm);
  display: inline-flex; align-items: center; white-space: nowrap;
  font-size: 11px; color: var(--openbitfun-color-content-caption);
}
.titlebar__tab.is-active { background: var(--openbitfun-color-surface-panel); color: var(--openbitfun-color-content-primary); font-weight: 600; }
/* .badge 已删 —— surface 标识改用 StatusPill 的中性 tone（.ds-pill，不传 data-tone）。
   DS 里没有专门的「标签」组件：Capsule 只有 14 行，是浮动操作宿主，没有任何视觉，
   套上来等于什么都没换。中性 pill 的底色 action-neutral-surface 与原来的
   key-hint-background 同为 rgba(0,0,0,.08)，所以底色没变，只是字阶从 mono 变成 meta。 */
.app__body { flex: 1; display: flex; min-height: 0; }

.rail {
  width: 44px; flex: 0 0 44px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 0; background: var(--openbitfun-color-surface-chrome); border-inline-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
/* 左轨图标用 .ds-icon-btn（= IconButton），尺寸/圆角/悬停都交给它；
   选中项用它的 fill 变体（component-button-fill-background），不另造一套选中色。
   用 .rail 前缀是为了压过文件后面 .ds-icon-btn 的默认色（同为 0,1,0 时后者在后）。
   这三个是假窗口里的装饰图标，不是真导航，所以光标保持默认，别假装能点。 */
.rail .rail__btn { color: var(--openbitfun-color-content-caption); cursor: default; }
.rail .rail__btn[data-openbitfun-variant="fill"] { color: var(--openbitfun-color-content-primary); }

.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat__stream { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: var(--openbitfun-space-2); }
/* 头像直接用 .ds-avatar（= Avatar）；Agent 那侧加 data-tone="primary" 走品牌实心 */
/* 对话写真文案，不再留骨架条 —— 页面其余部分已经是真组件，灰条反而成了唯一的假东西。
   内容本身也是论点：Agent 一边聊一边把结论写回 PRD，这才叫「读得懂画布上的内容」。 */
.msg__text {
  flex: 1; min-width: 0; margin: 0;
  font-size: var(--openbitfun-type-body-sm-font-size);
  line-height: var(--openbitfun-type-body-sm-line-height);
  letter-spacing: var(--openbitfun-type-body-sm-letter-spacing);
  color: var(--openbitfun-color-content-secondary);
}
.msg--user .msg__text { color: var(--openbitfun-color-content-primary); }
/* 输入区用一层灰填充跟对话流分开（原来靠 border-top） */
.composer {
  flex: 0 0 auto; padding: 9px 11px;
  display: flex; align-items: center; gap: 8px;
  background: var(--openbitfun-color-surface-chrome); border-block-start: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
.composer__field {
  flex: 1; block-size: var(--openbitfun-control-height-sm);
  display: flex; align-items: center; padding-inline: var(--openbitfun-space-3);
  border-radius: var(--openbitfun-radius-base); background: var(--openbitfun-color-surface-panel);
  border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-field-border);
  color: var(--openbitfun-color-content-caption); font-size: var(--openbitfun-font-size-xs);
}
/* 发送键 = .ds-icon-btn 的 primary 变体，尺寸跟输入框同高 */

/* ════════════════════════════════════════════════════════════════════════
   多 tab 预览面板
   ════════════════════════════════════════════════════════════════════════ */
.panel {
  width: 268px; flex: 0 0 268px;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--openbitfun-color-surface-chrome); border-inline-start: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
/* 面板本身是灰的，表头用白填充顶出来，就不需要下描边了 */
.panel__head {
  flex: 0 0 38px; height: 38px;
  display: flex; align-items: center; gap: 7px; padding: 0 9px 0 12px;
  background: var(--openbitfun-color-surface-panel);
}
.panel__title { font-size: 12px; font-weight: 700; }
.panel__count { font-family: var(--openbitfun-font-family-mono); font-size: 9.5px; color: var(--openbitfun-color-content-caption); }
.panel__actions { margin-left: auto; display: flex; align-items: center; gap: 5px; }

/* 这里原本是手写的 .btn / .btn--primary / .btn--quiet / .btn--tiny / .icon-btn 两套。
   已全部换成 .ds-btn / .ds-icon-btn（= Button / IconButton 配方）。
   顺带修掉一个一直没被发现的视觉缺陷：.btn 和 .icon-btn 都没写 border: 0，
   而本文件全局只重置了 button 的 font/color，**没有 border 重置** ——
   所以它们一直在渲染浏览器默认按钮描边，截图里那圈像手绘的重框就是这么来的。 */

/* tab 条 */
/* ── TabGroup ───────────────────────────────────────────────────────────
   配方源：components/TabGroup/TabGroup.module.css（data-size="sm" 那一档）。
   形态和上一版完全不同：不是下划线 tab，是**带边框的药丸**，选中态靠填充区分
   （color-selection-surface + border 转透明），和真组件一致。
   类名保留 .tab，因为演示脚本按 .tab.is-active 定位命中点。 */
.tabbar {
  flex: 0 0 auto;
  display: flex; align-items: center;
  gap: var(--openbitfun-control-tab-group-gap);
  padding-block: var(--openbitfun-space-1);
  padding-inline: var(--openbitfun-space-2);
  background: var(--openbitfun-color-surface-workbench);
  border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  overflow-x: auto; overflow-y: hidden;
}
.tabbar::-webkit-scrollbar { height: 0; }
.tab {
  display: inline-flex; align-items: center; gap: var(--openbitfun-space-1);
  flex: 0 0 auto;
  block-size: var(--openbitfun-control-tab-group-item-height-sm);
  padding-inline: var(--openbitfun-control-tab-group-item-padding-inline-sm);
  border: var(--openbitfun-border-width-default) solid var(--openbitfun-component-button-outline-border);
  border-radius: var(--openbitfun-control-tab-group-item-radius);
  color: var(--openbitfun-color-content-primary);
  background: transparent;
  font-family: var(--openbitfun-type-label-md-font-family);
  font-size: var(--openbitfun-type-label-md-font-size);
  font-weight: var(--openbitfun-type-label-md-font-weight);
  letter-spacing: var(--openbitfun-type-label-md-letter-spacing);
  line-height: var(--openbitfun-type-label-md-line-height);
  white-space: nowrap; cursor: pointer;
  transition: background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              border-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.tab:hover { background: var(--openbitfun-component-button-fill-background); border-color: var(--openbitfun-component-button-outline-border-interactive); }
.tab.is-active {
  background: var(--openbitfun-color-selection-surface);
  border-color: transparent;
  font-weight: var(--openbitfun-type-label-selected-font-weight);
}
/* 已跳出到别的屏 —— 对应真组件的 :disabled 档，复用同一组 token */
.tab.is-popped { color: var(--openbitfun-color-action-neutral-content-disabled); }
.tab.is-popped:hover { background: transparent; border-color: var(--openbitfun-component-button-outline-border); }
/* 这扇窗现在挂在哪块屏上（真组件里的 labelSuffix / endAction 位置） */
.tab__where {
  font-family: var(--openbitfun-font-family-mono);
  font-size: var(--openbitfun-font-size-3xs); letter-spacing: 0.04em;
  padding: 1px var(--openbitfun-space-1); border-radius: var(--openbitfun-radius-pill);
  background: var(--openbitfun-color-action-neutral-surface);
  color: var(--openbitfun-color-content-secondary);
}
/* 跳出按钮 —— 对应真组件的 .endAction 槽位。
   常态给 0.55 透明度而不是 0：这条动线正是这个 Demo 要讲的东西，藏到 hover 才出现就讲不清了。 */
.tab__pop {
  display: inline-grid; place-items: center;
  inline-size: 20px; block-size: 20px;
  border-radius: var(--openbitfun-radius-pill);
  color: var(--openbitfun-color-action-neutral-content);
  opacity: 0.55; cursor: pointer;
  transition: opacity var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.tab:hover .tab__pop { opacity: 1; }
.tab__pop:hover { opacity: 1; background: var(--openbitfun-color-action-neutral-surface-hover); }

/* overflow-y: auto 是必须的，不是可选：空态里那段「已跳出清单」在窄面板下会
   比可视区高（实测 scrollHeight 423 / clientHeight 255，被裁 168px），
   而这里原本是 visible —— 等于 4 行「收回」按钮点不到又没有滚动条。
   配合下面的 min-height: 0 才能让 flex 子项真的可滚。 */
.panel__body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
.panel__foot {
  flex: 0 0 auto; padding: 7px 12px;
  font-size: 10px; color: var(--openbitfun-color-content-caption); background: var(--openbitfun-color-surface-workbench);
  border-block-start: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  display: flex; align-items: center; gap: 6px;
}

/* 占位符 */
/* ── Empty ──────────────────────────────────────────────────────────────
   配方源：components/Empty/Empty.module.css
     .placeholder ← .root   __icon ← .media   __title ← .title
     __desc ← .description  __row ← .actions
   外面那圈虚线 + 浅底是 demo 自己的容器皮（Empty 的 .root 不带底也不带边），
   用来表达「这块面板当前没有内容」；里面从图标到字阶全部走 Empty 的槽位。
   图标那格从「灰底圆角方块 + 深色图标」换成了 Empty 的裸图标（media 只给尺寸和
   component-empty-media 这个浅灰），这是真组件的样子。 */
.placeholder {
  flex: 1; margin: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--openbitfun-layout-empty-gap);
  padding: var(--openbitfun-layout-empty-padding-block) var(--openbitfun-layout-empty-padding-inline);
  color: var(--openbitfun-color-content-muted);
  text-align: center;
  border-radius: var(--openbitfun-layout-card-radius-md);
  border: var(--openbitfun-border-width-default) dashed var(--openbitfun-color-border-default);
  background: var(--openbitfun-color-surface-subtle);
}
.placeholder__icon {
  display: inline-flex; align-items: center; justify-content: center;
  inline-size: var(--openbitfun-layout-empty-media-size-md);
  block-size: var(--openbitfun-layout-empty-media-size-md);
  color: var(--openbitfun-component-empty-media);
}
.placeholder__icon > svg {
  display: block;
  inline-size: var(--openbitfun-layout-empty-icon-size-md);
  block-size: var(--openbitfun-layout-empty-icon-size-md);
}
.placeholder__title {
  color: var(--openbitfun-color-content-muted);
  font-family: var(--openbitfun-type-label-md-font-family);
  font-size: var(--openbitfun-type-label-md-font-size);
  font-weight: var(--openbitfun-type-label-md-font-weight);
  line-height: var(--openbitfun-type-label-md-line-height);
  letter-spacing: var(--openbitfun-type-label-md-letter-spacing);
}
.placeholder__desc {
  max-inline-size: 42ch;
  color: var(--openbitfun-color-content-muted);
  font-family: var(--openbitfun-type-body-sm-font-family);
  font-size: var(--openbitfun-type-body-sm-font-size);
  font-weight: var(--openbitfun-type-body-sm-font-weight);
  line-height: var(--openbitfun-type-body-sm-line-height);
  letter-spacing: var(--openbitfun-type-body-sm-letter-spacing);
}
.placeholder__row {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--openbitfun-space-2); flex-wrap: wrap;
  margin-block-start: var(--openbitfun-space-1);
}
/* 「正在哪块屏显示」是状态指示，直接用 StatusPill（.ds-pill data-tone="success"），
   Empty 里没有对应槽位 —— 它是这块面板特有的信息，只有 b 的强调色需要补。 */
.placeholder__where b { color: var(--openbitfun-color-content-primary); font-weight: var(--openbitfun-type-label-selected-font-weight); }
/* 全部跳出后的可恢复清单。Empty 没有对应槽位，是这块面板自己的附加内容，
   所以只保留布局；行内的角标与按钮都是真组件（.tab__where 的 pill / .ds-btn）。 */
.placeholder__list { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-top: 3px; }
.placeholder__item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 9px; border-radius: var(--openbitfun-radius-sm);
  background: var(--openbitfun-color-surface-tertiary);
  font-size: 11px;
}
.placeholder__item span:first-child { flex: 1; text-align: left; }
/* .pulse 已删 —— 那个绿点换成 StatusPill 自带的 .ds-pill__dot（currentColor，5px）。 */

/* 屏内空状态 */
.empty-hint {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; color: var(--openbitfun-color-content-caption); font-size: 11.5px;
}
.empty-hint__box {
  min-width: 150px; max-width: 92%;
  min-height: 100px; padding: 14px;
  border-radius: var(--openbitfun-radius-lg);
  background: var(--openbitfun-color-surface-panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.empty-hint__title { font-size: 11.5px; font-weight: 600; color: var(--openbitfun-color-content-secondary); }

/* ════════════════════════════════════════════════════════════════════════
   独立窗口（屏内，可拖动 / 跨屏 / 缩放）
   ════════════════════════════════════════════════════════════════════════ */
/* 浮窗压在同样是白的 app 上，光靠浅表面分不开，
   所以按真系统浮层的做法「描边 + 投影」一起用。 */
.detached {
  position: absolute;
  display: flex; flex-direction: column;
  min-width: 200px; min-height: 150px;
  background: var(--openbitfun-color-surface-panel); border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-default);
  border-radius: var(--openbitfun-radius-lg);
  box-shadow: var(--openbitfun-shadow-menu);
  overflow: hidden;
  opacity: 0; transform: scale(0.97);
  transition: opacity 0.3s var(--openbitfun-motion-easing-standard) 0.05s, transform 0.34s var(--openbitfun-motion-easing-standard) 0.05s;
}
.detached.is-in { opacity: 1; transform: scale(1); }
.detached.is-flash { box-shadow: 0 0 0 2px var(--openbitfun-color-action-primary-background), var(--openbitfun-shadow-menu); }
.detached__titlebar {
  flex: 0 0 32px; height: 32px;
  display: flex; align-items: center; gap: 8px; padding: 0 8px 0 11px;
  background: var(--openbitfun-color-surface-chrome);
  cursor: grab; user-select: none; touch-action: none;
}
.detached__titlebar:active { cursor: grabbing; }
.detached__title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detached__sub { font-family: var(--openbitfun-font-family-mono); font-size: 9px; color: var(--openbitfun-color-content-caption); white-space: nowrap; }
.detached__actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.detached__body { flex: 1; min-height: 0; display: flex; }
.detached__resize {
  position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
  cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 50%,
              var(--openbitfun-color-border-strong) 50%, var(--openbitfun-color-border-strong) 62%, transparent 62%);
}
.drag-ghost {
  position: fixed; z-index: 999; pointer-events: none;
  border-radius: var(--openbitfun-radius-lg); background: var(--openbitfun-color-surface-panel); border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-default);
  box-shadow: var(--openbitfun-shadow-menu);
}

/* ════════════════════════════════════════════════════════════════════════
   Hub（面板内 compact / 独立窗口 full）
   ════════════════════════════════════════════════════════════════════════ */
.hub { flex: 1; display: flex; min-height: 0; min-width: 0; background: var(--openbitfun-color-surface-panel); }
.hub__targets {
  flex: 0 0 122px; width: 122px; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; gap: var(--openbitfun-overlay-menu-row-gap);
  padding: var(--openbitfun-space-1);
  background: var(--openbitfun-color-surface-chrome); border-inline-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
/* ── Listbox ────────────────────────────────────────────────────────────
   配方源：components/Listbox/Listbox.module.css
     .hub__group-title ← .groupLabel   .target ← .option
     .target__content ← .content       .target__name ← .label   .target__meta ← .description
   「预览目标」是单选设备列表，正对应 Listbox。选中态用 .option[data-selected] 的
   color-selection-surface 填充，替掉原先手搓的黑竖条（真组件靠填充表选中，不靠侧边条）。

   ⚠️ .option 里那句 border: 0 是必须的，不是可省：本文件全局只重置了
   `button { font: inherit; color: inherit }`，**没有 border 重置**，所以 .target 作为
   <button> 一直在渲染浏览器默认描边 —— 之前截图里那些像手绘的重框就是这么来的。 */
.hub__group-title {
  display: flex; align-items: center;
  min-block-size: var(--openbitfun-overlay-menu-heading-height);
  padding-inline: var(--openbitfun-overlay-menu-heading-padding-inline);
  color: var(--openbitfun-color-content-muted);
  font-family: var(--openbitfun-type-meta-font-family);
  font-size: var(--openbitfun-type-meta-font-size);
  font-weight: var(--openbitfun-type-meta-font-weight);
  line-height: var(--openbitfun-type-meta-line-height);
  letter-spacing: var(--openbitfun-type-meta-letter-spacing);
}
.target {
  display: flex; align-items: center;
  inline-size: 100%; min-inline-size: 0;
  min-block-size: var(--openbitfun-overlay-menu-item-height);
  gap: var(--openbitfun-overlay-menu-item-gap);
  margin: 0;
  padding-block: var(--openbitfun-space-1);
  padding-inline: var(--openbitfun-overlay-menu-item-padding-inline);
  border: 0;
  border-radius: var(--openbitfun-overlay-menu-item-radius);
  outline: 0;
  color: inherit; background: transparent;
  font: inherit; text-align: start; cursor: pointer;
  transition: color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
/* 瞬时交互态不能盖掉持久选中态 —— 真组件里就是这么分的 */
.target:where(:not(:disabled):is(:hover, [data-active="true"])) { background: var(--openbitfun-color-action-neutral-surface); }
.target:where(:not(:disabled):active) { background: var(--openbitfun-color-action-neutral-surface-pressed); }
.target[data-selected="true"] { background: var(--openbitfun-color-selection-surface); }
.target:focus-visible { box-shadow: 0 0 0 var(--openbitfun-focus-width) var(--openbitfun-color-focus-ring); }
.target__content {
  display: flex; overflow: hidden; flex: 1 1 auto; min-inline-size: 0;
  flex-direction: column; gap: var(--openbitfun-space-1);
}
.target__name {
  overflow: hidden;
  font-family: var(--openbitfun-type-label-md-font-family);
  font-size: var(--openbitfun-type-label-md-font-size);
  font-weight: var(--openbitfun-type-label-md-font-weight);
  line-height: var(--openbitfun-type-label-md-line-height);
  letter-spacing: var(--openbitfun-type-label-md-letter-spacing);
  white-space: nowrap;
}
.target__meta {
  overflow: hidden;
  color: var(--openbitfun-color-content-muted);
  font-family: var(--openbitfun-type-meta-font-family);
  font-size: var(--openbitfun-type-meta-font-size);
  font-weight: var(--openbitfun-type-meta-font-weight);
  line-height: var(--openbitfun-type-meta-line-height);
  letter-spacing: var(--openbitfun-type-meta-letter-spacing);
  white-space: nowrap;
}

.hub__canvas-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hub__toolbar {
  flex: 0 0 31px; height: 31px;
  display: flex; align-items: center; gap: 7px; padding: 0 8px 0 11px;
  background: var(--openbitfun-color-surface-panel); border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  container-type: inline-size;
}
/* 窗口被夹窄时（例如落到竖屏副屏）不能折行，改成标题吃省略号、右侧控件保持完整 */
.hub__crumb { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hub__note {
  font-family: var(--openbitfun-font-family-mono); font-size: 9px; color: var(--openbitfun-color-content-caption);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.hub__zoom { margin-left: auto; flex: 0 0 auto; display: flex; align-items: center; gap: 5px; }
.hub__scale {
  font-family: var(--openbitfun-font-family-mono); font-size: 9px; color: var(--openbitfun-color-content-caption);
  min-width: 44px; text-align: right; white-space: nowrap;
}
/* 缩放组（「适配 30%」+ seg）固定 149px 且不许收缩，所以窗口一窄就是它溢出：
   实测竖屏副屏里的工具条内容盒只有 141px，seg 的右边缘会超出工具条 30px，100% 被裁成 10。
   141px 装不下 149px 的缩放组，但装得下砍掉百分比之后的 100px。
   阈值 210px 是按「内容盒」算的（container 查询比较的是内容盒，不含 padding）：
   主屏面板 248 / 横屏副屏窗口 431、415 都远在阈值之上，只有竖屏那个 141 会命中。 */
@container (max-width: 210px) {
  .hub__scale { display: none; }
}
/* 缩放缓切已改用 .ds-seg（= SegmentedControl），选中态走 aria-pressed，不再另起一套 */

/* 屏内画布：整块画布压成灰的，白色的浮窗 / 视口才不用描边就能读出来 */
.hub__canvas {
  flex: 1; min-height: 0; overflow: auto; padding: 12px;
  background: var(--openbitfun-color-surface-workbench);
}
.viewport-sizer { position: relative; }
.viewport {
  background: var(--openbitfun-color-surface-panel); border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-default);
  border-radius: var(--openbitfun-radius-base);
  transform-origin: top left;
}
.viewport__chrome {
  height: 23px; display: flex; align-items: center; gap: 7px; padding: 0 9px;
  background: var(--openbitfun-color-surface-chrome); border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  border-radius: 7px 7px 0 0;
  font-family: var(--openbitfun-font-family-mono); font-size: 9px; color: var(--openbitfun-color-content-caption); white-space: nowrap;
}
.vp-dots { display: inline-flex; gap: 3px; }
.vp-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--openbitfun-color-action-neutral-surface-hover); }

/* compact：目标列表收成横向 chip（这块是 Display 1 面板，走 hubHTML(tab,'compact')） */
.hub--compact { flex-direction: column; }
.hub--compact .hub__targets {
  flex: 0 0 auto; width: 100%; display: flex; flex-direction: row; gap: var(--openbitfun-space-1);
  padding: var(--openbitfun-space-1) var(--openbitfun-space-2);
  border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  overflow-x: auto;
}
.hub--compact .hub__group-title { padding-inline: var(--openbitfun-space-1); }
.hub--compact .hub__note { display: none; }
.hub--compact .target {
  inline-size: auto; flex: 0 0 auto; min-block-size: 0;
  padding-block: 2px; padding-inline: var(--openbitfun-space-2);
  border-radius: var(--openbitfun-radius-pill);
  background: var(--openbitfun-color-surface-panel);
  border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
.hub--compact .target:where(:not(:disabled):is(:hover, [data-active="true"])) { background: var(--openbitfun-color-action-neutral-surface); }
.hub--compact .target[data-selected="true"] {
  background: var(--openbitfun-color-selection-surface);
  border-color: transparent;
}
.hub--compact .target__meta { display: none; }
.hub--compact .hub__canvas { padding: 10px; }

/* ════════════════════════════════════════════════════════════════════════
   毕方组件 —— 每个配方都照抄同名组件模块，只用 design-system token。
   对应关系（右侧是仓库里的源文件）：
     .ds-btn        ← packages/ui/src/components/Button/Button.module.css
     .ds-icon-btn   ← components/IconButton/IconButton.module.css
     .ds-pill       ← components/StatusPill/StatusPill.module.css
     .ds-seg        ← components/SegmentedControl/SegmentedControl.module.css
     .ds-tab        ← components/TabGroup/TabGroup.module.css
     .ds-kbd        ← components/KeyHint
     .ds-avatar     ← components/Avatar
   变体一律走 data-openbitfun-variant / data-tone / data-size，和真组件同契约，
   这样从 Demo 抄回组件时属性名不用翻译。
   ════════════════════════════════════════════════════════════════════════ */

/* ── Button ─────────────────────────────────────────────────────────────
   默认（outline）变体：透明底 + 1px 描边；hover 由 fill-background 接管。
   真组件把 hover 底放在 ::before 上，这里照做，免得过渡和文字色互相打架。 */
.ds-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--openbitfun-space-1);
  block-size: var(--openbitfun-control-height-sm);
  padding-inline: var(--openbitfun-space-4);
  border: var(--openbitfun-border-width-default) solid var(--openbitfun-component-button-outline-border);
  border-radius: var(--openbitfun-radius-pill);
  color: var(--openbitfun-component-button-content);
  background: transparent;
  font-family: var(--openbitfun-type-label-md-font-family);
  font-size: var(--openbitfun-type-label-md-font-size);
  font-weight: var(--openbitfun-type-label-md-font-weight);
  line-height: var(--openbitfun-type-label-md-line-height);
  white-space: nowrap; cursor: pointer;
  isolation: isolate;
  transition: border-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-btn::before {
  content: ''; position: absolute; z-index: 0; inset: 0;
  border-radius: inherit; background: transparent;
  transition: background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-btn > * { position: relative; z-index: 1; }
.ds-btn:hover:not(:disabled) { border-color: var(--openbitfun-component-button-outline-border-interactive); }
.ds-btn:hover:not(:disabled)::before { background: var(--openbitfun-component-button-fill-background); }
.ds-btn:focus-visible { outline: var(--openbitfun-focus-width) solid var(--openbitfun-color-focus-ring); outline-offset: var(--openbitfun-focus-offset); }

.ds-btn[data-openbitfun-variant="fill"] {
  border-color: transparent; background: var(--openbitfun-component-button-fill-background);
}
.ds-btn[data-openbitfun-variant="fill"]:hover:not(:disabled) { border-color: transparent; }
.ds-btn[data-openbitfun-variant="fill"]:hover:not(:disabled)::before { background: var(--openbitfun-component-button-fill-background-hover); }

.ds-btn[data-openbitfun-variant="primary"] {
  border-color: transparent;
  background: var(--openbitfun-component-button-primary-background);
  color: var(--openbitfun-color-action-primary-content);
}
.ds-btn[data-openbitfun-variant="primary"]:hover:not(:disabled) { border-color: transparent; }
.ds-btn[data-openbitfun-variant="primary"]:hover:not(:disabled)::before { background: var(--openbitfun-component-button-primary-background-hover); }

/* 小尺寸档：真组件是 .button[data-size="xs"]，尺寸全走 control-button-xs-*。
   下面这条 > svg 能盖住 SVG 上的 width/height 属性 —— 表现属性优先级低于 CSS，
   所以图标会跟着 token 走，不用去改 markup 里的数字。 */
.ds-btn[data-size="xs"] {
  block-size: var(--openbitfun-control-button-xs-height);
  padding-inline: var(--openbitfun-control-button-xs-padding-inline);
  font-size: var(--openbitfun-type-meta-font-size);
}
.ds-btn[data-size="xs"] > svg {
  inline-size: var(--openbitfun-control-button-xs-leading-icon-size);
  block-size: var(--openbitfun-control-button-xs-leading-icon-size);
}

/* 禁用态：真组件 .button:disabled 只换内容色 + not-allowed，底与边全清掉，
   所以下面要显式把 fill / primary 的底色也清掉，不然禁用按钮还带着实心底。 */
.ds-btn:disabled,
.ds-icon-btn:disabled {
  color: var(--openbitfun-color-action-neutral-content-disabled);
  cursor: not-allowed;
}
.ds-btn:disabled { border-color: transparent; background: transparent; }
.ds-btn:disabled::before,
.ds-icon-btn:disabled::before { background: transparent; }
.ds-btn[data-openbitfun-variant="fill"]:disabled,
.ds-btn[data-openbitfun-variant="primary"]:disabled { background: transparent; }

/* ── IconButton ─────────────────────────────────────────────────────────
   默认 32px / 图标 14px / 圆角 radius-sm；circle 变体才是药丸。 */
.ds-icon-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  inline-size: var(--openbitfun-control-height-sm);
  block-size: var(--openbitfun-control-height-sm);
  padding: 0; border: 0; border-radius: var(--openbitfun-radius-sm);
  color: var(--openbitfun-color-content-primary);
  background: transparent; cursor: pointer; isolation: isolate;
  transition: color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-icon-btn::before {
  content: ''; position: absolute; z-index: 0; inset: 0;
  border-radius: inherit; background: transparent;
  transition: background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-icon-btn > svg { position: relative; z-index: 1; display: block; }
.ds-icon-btn:hover:not(:disabled)::before { background: var(--openbitfun-color-action-neutral-surface-hover); }
.ds-icon-btn:focus-visible { outline: var(--openbitfun-focus-width) solid var(--openbitfun-color-focus-ring); outline-offset: var(--openbitfun-focus-offset); }
/* 小尺寸档：真组件 .button[data-size="xs"] → 22px / 图标 14px */
.ds-icon-btn[data-size="xs"] {
  inline-size: var(--openbitfun-control-icon-button-xs-size);
  block-size: var(--openbitfun-control-icon-button-xs-size);
}
.ds-icon-btn[data-size="xs"] > svg {
  inline-size: var(--openbitfun-control-icon-button-xs-icon-size);
  block-size: var(--openbitfun-control-icon-button-xs-icon-size);
}
.ds-icon-btn[data-openbitfun-shape="circle"] { border-radius: var(--openbitfun-radius-pill); }
.ds-icon-btn[data-openbitfun-variant="primary"] {
  color: var(--openbitfun-color-action-primary-content);
  background: var(--openbitfun-color-action-primary-background);
}
.ds-icon-btn[data-openbitfun-variant="primary"]:hover:not(:disabled)::before { background: var(--openbitfun-color-action-primary-hover); }

/* ── StatusPill ─────────────────────────────────────────────────────────
   药丸、meta 字阶、上下 2px 左右 6px。tone 决定色。 */
.ds-pill {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--openbitfun-control-status-pill-gap);
  padding-block: var(--openbitfun-control-status-pill-padding-block);
  padding-inline: var(--openbitfun-control-status-pill-padding-inline);
  border: 0;
  border-radius: var(--openbitfun-control-status-pill-radius);
  color: var(--openbitfun-color-content-secondary);
  background: var(--openbitfun-color-action-neutral-surface);
  font-family: var(--openbitfun-type-meta-font-family);
  font-size: var(--openbitfun-type-meta-font-size);
  font-weight: var(--openbitfun-type-meta-font-weight);
  line-height: var(--openbitfun-type-status-pill-line-height);
  letter-spacing: var(--openbitfun-type-meta-letter-spacing);
  white-space: nowrap;
}
.ds-pill[data-openbitfun-shape="rounded"] { border-radius: var(--openbitfun-radius-sm); }
.ds-pill[data-tone="success"] { color: var(--openbitfun-color-status-success-content); background: var(--openbitfun-color-status-success-surface); }
.ds-pill[data-tone="info"]    { color: var(--openbitfun-color-status-info-content);    background: var(--openbitfun-color-status-info-surface); }
.ds-pill[data-tone="warning"] { color: var(--openbitfun-color-status-warning-content); background: var(--openbitfun-color-status-warning-surface); }
.ds-pill[data-tone="danger"]  { color: var(--openbitfun-color-status-danger-content);  background: var(--openbitfun-color-status-danger-surface); }
.ds-pill__dot {
  inline-size: 5px; block-size: 5px; flex: 0 0 5px;
  border-radius: var(--openbitfun-radius-pill); background: currentColor;
}

/* ── SegmentedControl ───────────────────────────────────────────────────
   槽底 action-neutral-surface-hover，选中段提到 surface-raised（白）。 */
.ds-seg {
  display: inline-flex; align-items: center;
  gap: var(--openbitfun-control-segmented-control-gap);
  padding: var(--openbitfun-control-segmented-control-padding);
  border: 0; border-radius: var(--openbitfun-control-segmented-control-radius);
  background: var(--openbitfun-color-action-neutral-surface-hover);
}
.ds-seg button {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--openbitfun-control-segmented-control-segment-gap);
  block-size: var(--openbitfun-control-segmented-control-segment-height);
  padding-block: 0;
  padding-inline: var(--openbitfun-control-segmented-control-segment-padding-inline);
  border: 0; border-radius: var(--openbitfun-control-segmented-control-segment-radius);
  color: var(--openbitfun-color-action-neutral-content);
  background: transparent;
  font-family: var(--openbitfun-type-label-md-font-family);
  font-size: var(--openbitfun-type-label-md-font-size);
  font-weight: var(--openbitfun-type-label-md-font-weight);
  line-height: var(--openbitfun-type-label-md-line-height);
  white-space: nowrap; cursor: pointer;
  transition: background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard),
              color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-seg button[aria-pressed="true"] {
  color: var(--openbitfun-color-content-primary);
  background: var(--openbitfun-color-surface-raised);
  font-weight: var(--openbitfun-type-label-selected-font-weight);
}
.ds-seg button:hover:not([aria-pressed="true"]) { background: var(--openbitfun-color-action-neutral-surface-hover); }
.ds-seg button:focus-visible { outline: var(--openbitfun-focus-width) solid var(--openbitfun-color-focus-ring); outline-offset: var(--openbitfun-focus-offset); }

/* ── KeyHint ────────────────────────────────────────────────────────────*/
.ds-kbd {
  padding: 1px var(--openbitfun-space-1);
  border-radius: var(--openbitfun-radius-xs);
  background: var(--openbitfun-color-key-hint-background);
  color: var(--openbitfun-color-key-hint-content);
  font-family: var(--openbitfun-font-family-mono);
  font-size: var(--openbitfun-font-size-2xs);
}

/* ── Avatar ─────────────────────────────────────────────────────────────*/
.ds-avatar {
  inline-size: 20px; block-size: 20px; flex: 0 0 20px;
  display: grid; place-items: center;
  border-radius: var(--openbitfun-radius-sm);
  background: var(--openbitfun-color-action-neutral-surface);
  color: var(--openbitfun-color-content-secondary);
  font-size: var(--openbitfun-font-size-2xs); font-weight: var(--openbitfun-font-weight-bold);
}
.ds-avatar[data-tone="primary"] { background: var(--openbitfun-color-action-primary-background); color: var(--openbitfun-color-action-primary-content); }

/* ── Switch ─────────────────────────────────────────────────────────────*/
.ds-switch {
  position: relative;
  inline-size: 32px; block-size: 18px; flex: 0 0 32px;
  border-radius: var(--openbitfun-radius-pill);
  background: var(--openbitfun-color-control-switch-track);
  transition: background-color var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-switch::after {
  content: ''; position: absolute; inset-block-start: 2px; inset-inline-start: 2px;
  inline-size: 14px; block-size: 14px;
  border-radius: var(--openbitfun-radius-pill);
  background: var(--openbitfun-color-control-switch-thumb);
  transition: translate var(--openbitfun-motion-duration-fast) var(--openbitfun-motion-easing-standard);
}
.ds-switch[aria-checked="true"] { background: var(--openbitfun-color-control-switch-track-checked); }
.ds-switch[aria-checked="true"]::after { translate: 14px 0; }

/* ════════════════════════════════════════════════════════════════════════
   视口内容 —— 真的毕方组件拼出的界面，不再是灰块占位。
   三块屏分别放：PRD 文档 / 页面预览 / 组件矩阵。
   ════════════════════════════════════════════════════════════════════════ */
.doc {
  padding: var(--openbitfun-space-6) var(--openbitfun-space-8);
  display: flex; flex-direction: column; gap: var(--openbitfun-space-3);
  color: var(--openbitfun-color-content-primary);
}
.doc__head { display: flex; align-items: center; gap: var(--openbitfun-space-3); }
.doc__title {
  font-family: var(--openbitfun-type-heading-page-font-family);
  font-size: var(--openbitfun-type-heading-page-font-size);
  font-weight: var(--openbitfun-type-heading-page-font-weight);
  line-height: var(--openbitfun-type-heading-page-line-height);
  letter-spacing: var(--openbitfun-letter-spacing-tight);
}
.doc__meta {
  display: flex; align-items: center; gap: var(--openbitfun-space-2);
  font-size: var(--openbitfun-font-size-meta);
  color: var(--openbitfun-color-content-caption);
}
.doc__h2 {
  margin-block-start: var(--openbitfun-space-3);
  font-family: var(--openbitfun-type-heading-section-font-family);
  font-size: var(--openbitfun-type-heading-section-font-size);
  font-weight: var(--openbitfun-type-heading-section-font-weight);
  line-height: var(--openbitfun-type-heading-section-line-height);
}
.doc__p {
  font-size: var(--openbitfun-font-size-sm);
  line-height: var(--openbitfun-line-height-reading);
  color: var(--openbitfun-color-content-secondary);
}
.doc__list {
  margin: 0; padding-inline-start: var(--openbitfun-space-5);
  display: grid; gap: var(--openbitfun-space-1);
  font-size: var(--openbitfun-font-size-sm);
  line-height: var(--openbitfun-line-height-reading);
  color: var(--openbitfun-color-content-secondary);
}
/* 验收表 —— 用 border-subtle 横线分行，不用表格线框 */
.doc__table { display: grid; }
.doc__tr {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: var(--openbitfun-space-3);
  padding-block: 7px; padding-inline: var(--openbitfun-space-3);
  border-block-start: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  font-size: var(--openbitfun-font-size-xs);
  color: var(--openbitfun-color-content-secondary);
}
.doc__tr:last-child { border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle); }
.doc__tr--head { color: var(--openbitfun-color-content-caption); font-size: var(--openbitfun-font-size-meta); }

/* 页面预览：工具条 + 筛选 chips + 三张卡片 */
.pageview { display: flex; flex-direction: column; }
.pageview__bar {
  display: flex; align-items: center; gap: var(--openbitfun-space-2);
  padding: var(--openbitfun-space-3) var(--openbitfun-space-5);
  background: var(--openbitfun-color-surface-panel);
  border-block-end: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
}
.pageview__title {
  font-family: var(--openbitfun-type-heading-card-font-family);
  font-size: var(--openbitfun-type-heading-card-font-size);
  font-weight: var(--openbitfun-type-heading-card-font-weight);
}
.pageview__gap { margin-inline-start: auto; }
.pageview__filters {
  display: flex; flex-wrap: wrap; gap: var(--openbitfun-space-2);
  padding: var(--openbitfun-space-3) var(--openbitfun-space-5) 0;
}
.tiles {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--openbitfun-space-3);
  padding: var(--openbitfun-space-4) var(--openbitfun-space-5);
}
/* ── Card ───────────────────────────────────────────────────────────────
   配方源：components/Card/Card.module.css
     .tile ← .root   __header ← .header   __header-content ← .headerContent
     __title ← .title   __text ← .description   __footer ← .footer
   data-radius="md"(12px) / data-padding="sm"(12px) / data-gap="sm"(8px)
   正好等于原来手写的圆角、内边距和间距，这几处尺寸没动。
   ⚠️ data-appearance="raised" 会给卡片加上 shadow-overlay（0 4px 20px rgba(0,0,0,.12)）——
   原来手写版没有投影，这是真组件 raised 档的定义，不是我加的。不想要就换成 subtle。 */
.tile {
  display: flex; flex-direction: column; min-inline-size: 0;
  border: var(--openbitfun-border-width-default) solid transparent;
  color: var(--openbitfun-color-content-secondary);
  background: transparent;
}
.tile[data-appearance="raised"] {
  border-color: var(--openbitfun-color-border-subtle);
  background: var(--openbitfun-color-surface-raised);
  box-shadow: var(--openbitfun-shadow-overlay);
}
.tile[data-radius="md"] { border-radius: var(--openbitfun-layout-card-radius-md); }
.tile[data-padding="sm"] { padding: var(--openbitfun-layout-card-padding-sm); }
.tile[data-gap="sm"] { gap: var(--openbitfun-layout-card-gap-sm); }
.tile__header {
  display: flex; align-items: flex-start; min-inline-size: 0;
  gap: var(--openbitfun-layout-card-header-gap);
}
.tile__header-content {
  display: flex; flex: 1 1 auto; min-inline-size: 0; flex-direction: column;
  gap: var(--openbitfun-layout-card-title-description-gap);
}
.tile__title {
  min-inline-size: 0; overflow-wrap: anywhere;
  color: var(--openbitfun-color-content-primary);
  font-family: var(--openbitfun-type-heading-card-font-family);
  font-size: var(--openbitfun-type-heading-card-font-size);
  font-weight: var(--openbitfun-type-heading-card-font-weight);
  line-height: var(--openbitfun-type-heading-card-line-height);
  letter-spacing: var(--openbitfun-type-heading-card-letter-spacing);
}
.tile__text {
  min-inline-size: 0;
  color: var(--openbitfun-color-content-secondary);
  font-family: var(--openbitfun-type-body-sm-font-family);
  font-size: var(--openbitfun-type-body-sm-font-size);
  font-weight: var(--openbitfun-type-body-sm-font-weight);
  line-height: var(--openbitfun-type-body-sm-line-height);
  letter-spacing: var(--openbitfun-type-body-sm-letter-spacing);
}
.tile__footer {
  display: flex; align-items: center; min-inline-size: 0;
  gap: var(--openbitfun-layout-card-footer-gap);
}

/* 组件矩阵：每格摆一个真控件的实例，底下标名字 */
.matrix {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: var(--openbitfun-space-3);
  padding: var(--openbitfun-space-4) var(--openbitfun-space-5);
}
.matrix__cell {
  display: grid; place-items: center; align-content: center;
  gap: var(--openbitfun-space-2);
  min-block-size: 62px; padding: var(--openbitfun-space-3);
  background: var(--openbitfun-color-surface-panel);
  border: var(--openbitfun-border-width-default) solid var(--openbitfun-color-border-subtle);
  border-radius: var(--openbitfun-radius-base);
}
.matrix__cell > small {
  font-family: var(--openbitfun-font-family-mono);
  font-size: var(--openbitfun-font-size-3xs);
  color: var(--openbitfun-color-content-caption);
}

/* ════════════════════════════════════════════════════════════════════════
   真实弹窗 surface
   ════════════════════════════════════════════════════════════════════════ */
.surface-root { position: fixed; inset: 0; display: none; flex-direction: column; background: var(--openbitfun-color-surface-panel); }
body.mode-surface .surface-root { display: flex; }
body.mode-surface .desk { display: none; }
.surface-root__bar {
  flex: 0 0 38px; height: 38px; display: flex; align-items: center; gap: 9px;
  padding: 0 9px 0 13px; background: var(--openbitfun-color-surface-chrome);
}
.surface-root__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  padding: 9px 15px; border-radius: var(--openbitfun-radius-lg); font-size: 12px; font-weight: 500;
  color: var(--openbitfun-color-content-inverse); background: var(--openbitfun-color-action-primary-background);
  box-shadow: var(--openbitfun-shadow-menu);
  opacity: 0; pointer-events: none; z-index: 1000;
  transition: opacity 0.2s var(--openbitfun-motion-easing-standard), transform 0.24s var(--openbitfun-motion-easing-standard);
}
.toast.is-in { opacity: 1; transform: translate(-50%, 0); }

/* ════════════════════════════════════════════════════════════════════════
   实时播放：虚拟光标 / 字幕 / 聚光 / 进度
   ════════════════════════════════════════════════════════════════════════ */
.progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; }
.progress i {
  display: block; height: 100%; width: 100%; background: var(--openbitfun-color-action-primary-background);
  transform: scaleX(0); transform-origin: left center;
  transition: transform 0.6s var(--openbitfun-motion-easing-standard);
}

.director { display: inline-flex; align-items: center; gap: var(--openbitfun-space-2); }
/* 播放 / 重播直接用 .ds-icon-btn（= IconButton），不再另起一套 */
.stepdots { display: inline-flex; align-items: center; gap: var(--openbitfun-space-1); }
.stepdots i {
  inline-size: 5px; block-size: 5px; border-radius: var(--openbitfun-radius-pill);
  background: var(--openbitfun-color-action-neutral-surface-hover);
  transition: all 0.32s var(--openbitfun-motion-easing-standard);
}
.stepdots i.is-done { background: var(--openbitfun-color-border-strong); }
.stepdots i.is-now { inline-size: 16px; background: var(--openbitfun-color-action-primary-background); }

/* 聚光：没参与当前步骤的屏压暗 */
.display { transition: opacity 0.45s var(--openbitfun-motion-easing-standard), filter 0.45s var(--openbitfun-motion-easing-standard); }
.display.is-dim { opacity: 0.34; filter: saturate(0.4); }

/* 字幕 */
.caption {
  position: fixed; left: 50%; bottom: 22px; z-index: 70;
  transform: translate(-50%, 14px);
  max-width: min(760px, calc(100% - 40px));
  display: flex; align-items: center; gap: 13px;
  padding: 12px 18px; border-radius: var(--openbitfun-radius-xl);
  background: color-mix(in srgb, #101a27 95%, transparent);
  color: var(--openbitfun-color-content-inverse);
  box-shadow: var(--openbitfun-shadow-menu);
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s var(--openbitfun-motion-easing-standard), transform 0.32s var(--openbitfun-motion-easing-standard);
}
.caption.is-in { opacity: 1; transform: translate(-50%, 0); }
.caption__idx {
  flex: 0 0 auto; font-family: var(--openbitfun-font-family-mono); font-size: 10px; letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.45);
}
.caption__text { font-size: 13px; line-height: 1.55; }
body.is-playing .toast { bottom: 100px; }

/* 虚拟光标 */
.vcur {
  position: fixed; left: 0; top: 0; z-index: 90;
  width: 20px; height: 20px; pointer-events: none;
  transform: translate3d(-100px, -100px, 0);
  transition: transform 0.62s var(--openbitfun-motion-easing-standard);
}
.vcur svg { display: block; transition: transform 0.12s var(--openbitfun-motion-easing-standard); }
.vcur.is-down svg { transform: scale(0.82); }
.ripple {
  position: fixed; z-index: 89; width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%; pointer-events: none; border: 2px solid var(--openbitfun-color-action-primary-background);
}
.is-pressed { box-shadow: 0 0 0 3px var(--openbitfun-color-action-neutral-surface-hover) !important; }

/* ════════════════════════════════════════════════════════════════════════
   窄窗口降级：页头不参与 --fit 缩放，宽度不够时只能靠让位。
   实测页头需要 741px（视口 ≥773px），所以 880px 起先让出装饰性的概念 chips，
   保住「Agent 视野」徽标和右侧播放 / 重置。
   ════════════════════════════════════════════════════════════════════════ */
@media (max-width: 560px) {
  .vision-badge { display: none; }
}
</style>
</head>
<body>

<div class="desk">

    </div>
    <span class="vision-badge" id="visionBadge"

    <div class="header-actions">

  <div class="desk__fit" id="fit">

                  </span>

                  </span>
                </nav>

                <section class="chat">

                    </div>
                    <div class="msg">

                    </div>

                <aside class="panel">

                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="9" height="8" rx="1.3" stroke="currentColor" stroke-width="1.2"/><path d="M8 8l5.5-5.5M10 2.5h3.5V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div class="progress" id="progress" aria-hidden="true"><i></i></div>
<div class="vcur" id="vcur" aria-hidden="true">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M4.2 2.6 15.3 9.2c.55.32.42 1.15-.19 1.28l-4.4 1.02-1.7 4.3c-.24.6-1.1.55-1.27-.07L4.2 2.6z"

<script>
'use strict';

/* ============================================================
   数据
   ============================================================ */
/* 低保真：机型不带品牌型号，只保留「多端」这件事和真实尺寸 */

  { id: 'phone-l', name: '手机·大', width: 430,  height: 932  },

const DISPLAY_NAMES = { 1: 'Display 1 · 主屏', 2: 'Display 2 · 横屏副屏', 3: 'Display 3 · 竖屏副屏' };

const TABS_INIT = [
  { id: 'prd',    title: 'PRD',   kind: 'doc',        device: 'tablet',  zoom: 'fit' },
  { id: 'page-1', title: '页面 1', kind: 'page',       device: 'phone',   zoom: 'fit', url: 'app.openbitfun.com/orders' },

];

/* ============================================================
   状态
   ============================================================ */
const state = {
  tabs: TABS_INIT.map((t) => ({ ...t, where: null, win: null })),
  activeId: 'prd',
  popups: new Map(),   // tabId -> WindowProxy（真实窗口）
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const tabById = (id) => state.tabs.find((t) => t.id === id);
const isPopped = (t) => t.where !== null;
const deviceOf = (id) => DEVICES.find((d) => d.id === id) || DEVICES[1];
const whereLabel = (t) =>
  t.where === 'window' ? '真实浏览器窗口' : DISPLAY_NAMES[Number(String(t.where).replace('display-', ''))];
const whereBadge = (t) =>
  t.where === 'window' ? '窗口' : 'D' + String(t.where).replace('display-', '');

/* ============================================================
   渲染：面板主体

function renderPanel() {
  const body = $('#panelBody');

  $('#panelCount').textContent = poppedCount ? `${poppedCount}/${state.tabs.length} 已跳出` : `${state.tabs.length} 个预览`;

  $('#recallAllBtn').disabled = !poppedCount;
  $('#popBtn').disabled = !active || isPopped(active);
  $('#panelBody').dataset.tab = active ? active.id : '__none__';

  if (active && !isPopped(active)) {
    body.innerHTML = hubHTML(active, 'compact');
    $('#panelFoot').textContent = '跳出是「按 tab」的：跳走后下一个 tab 会自动顶上';

      </div>

      <span class="ds-pill placeholder__where" data-tone="success"><span class="ds-pill__dot"></span>正在 <b>${whereLabel(active)}</b> 显示</span>
      <div class="placeholder__row">
        <button class="ds-btn" data-size="xs" data-action="focus-tab" data-tab-id="${active.id}">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>

          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M9 3h3.2A1.3 1.3 0 0113.5 4.3v7.9A1.3 1.3 0 0112.2 13.5H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.5 5.5L3 8l3.5 2.5M3.3 8h6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>

    ? '点任意 tab 可查看它的落点，或全部收回'
