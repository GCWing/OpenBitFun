[package]
name = "openbitfun-installer"
version = "1.0.5"
authors = ["OpenBitFun Team"]
edition = "2021"
description = "OpenBitFun Custom Installer - Modern branded installation experience"

[lib]
name = "openbitfun_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openbitfun-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# This standalone app does not commit a Cargo.lock. Keep the Tauri build-time
# crates aligned with the patched 2.11 runtime instead of resolving 2.7/2.10.
tauri-codegen = "=2.6.3"
zip = "0.6"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-macros = "=2.6.3"
tauri-plugin = "=2.6.3"
tauri-utils = "=2.9.3"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1.0"
log = "0.4"
dirs = "5.0"
zip = "0.6"
openbitfun-core-types = { path = "../../src/crates/contracts/core-types" }
openbitfun-ai-adapters = { path = "../../src/crates/adapters/ai-adapters" }
openbitfun-services-core = { path = "../../src/crates/services/services-core", features = ["json-io"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
mslnk = "0.1"

[patch.crates-io]
# The installer is a standalone Cargo workspace without a committed lockfile.
# Keep its Tauri runtime family aligned with the main workspace's reviewed fix.
tauri-runtime = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true
